<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitFix Workshop Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div className="text-center p-6 bg-gray-900 border border-gray-800 rounded-xl shadow-2xl max-w-md w-full mx-4">
                    <h1 className="text-3xl font-bold mb-3 text-emerald-400">CircuitFix 🚀</h1>
                    <p className="text-gray-300 mb-4">نظام إدارة الورشة خدام 100% وبدون أخطاء!</p>
                    <div className="p-3 bg-gray-800 rounded-lg text-sm text-gray-400">
                        جاهز للإدارة والصيانة
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
