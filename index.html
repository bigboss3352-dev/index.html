                            {device.status === 'waiting_parts' && (
                                <button
                                    onClick={() => onUpdateStatus('in_progress')}
                                    className="w-full py-2 px-3 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i className="fa-solid fa-box-open"></i>
                                    <span>{t('partsArrivedAction')}</span>
                                </button>
                            )}

                            {device.status === 'ready' && (
                                <button
                                    onClick={() => onUpdateStatus('delivered')}
                                    className="w-full py-2 px-3 bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i className="fa-solid fa-box-archive"></i>
                                    <span>{t('deliverAndCollectAction')}</span>
                                </button>
                            )}

                            {/* Status Changer dropdown */}
                            <select
                                value={device.status}
                                onChange={(e) => onUpdateStatus(e.target.value)}
                                className="w-full bg-darkBg border border-darkBorder rounded-xl px-2.5 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-emerald-500 cursor-pointer">
                                {Object.entries(STATUS_CONFIG).map(([k, c]) => (
                                    <option key={k} value={k}>{t('changeStatusTo')} {t('status_' + k) || c.label}</option>
                                ))}
                            </select>
                        </div>

                        {/* Communication & Print Action Buttons */}
                        <div className={`grid ${onDelete && role === 'manager' ? 'grid-cols-5' : 'grid-cols-4'} gap-1.5 pt-1`}>
                            {/* WhatsApp button */}
                            <button
                                onClick={onOpenWhatsApp}
                                title={t('sendWhatsAppWithRib')}
                                className="py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/30 flex items-center justify-center transition text-xs font-bold">
                                <i className="fa-brands fa-whatsapp text-sm"></i>
                            </button>

                            {/* Direct phone call */}
                            <a
                                href={`tel:${device.phone}`}
                                title={t('callCustomerAction')}
                                className="py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 flex items-center justify-center transition text-xs">
                                <i className="fa-solid fa-phone text-xs"></i>
                            </a>

                            {/* Print receipt */}
                            <button
                                onClick={onPrintReceipt}
                                title={t('printOfficialReceipt')}
                                className="py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 flex items-center justify-center transition text-xs">
                                <i className="fa-solid fa-print text-xs"></i>
                            </button>

                            {/* Edit */}
                            <button
                                onClick={onEdit}
                                title={t('editTicketDetails')}
                                className="py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 flex items-center justify-center transition text-xs">
                                <i className="fa-solid fa-pen text-xs"></i>
                            </button>

                            {/* Delete (Manager only) */}
                            {onDelete && role === 'manager' && (
                                <button
                                    onClick={onDelete}
                                    title={t('deleteTicketPermanent')}
                                    className="py-2 rounded-xl bg-rose-500/15 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 flex items-center justify-center transition text-xs">
                                    <i className="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        /* -------------------------------------------------------------
           INTAKE / EDIT MODAL COMPONENT (Upgraded with Brands, Multi-Faults & Parts Supplier)
           ------------------------------------------------------------- */
        function IntakeModal({ device, nextId, settings, role, currentUser, availableTechnicians = [], onClose, onSave, currentLang = 'ar' }) {
            const isEdit = !!device;
            const t = (key, params) => (window.getTranslation ? window.getTranslation(key, currentLang, params) : key);
            const isRtl = (window.SUPPORTED_LANGUAGES && window.SUPPORTED_LANGUAGES[currentLang]?.dir === 'rtl') || currentLang === 'ar';

            // 1. Auto-fill assigned technician from logged-in account
            const defaultTech = useMemo(() => {
                if (device?.technician) return device.technician;
                if (currentUser?.fullName) return currentUser.fullName;
                if (availableTechnicians && availableTechnicians.length > 0) return availableTechnicians[0];
                return settings?.technicians?.[0] || 'يوسف السالمي';
            }, [device, currentUser, availableTechnicians, settings]);

            const [customerName, setCustomerName] = useState(device?.customerName || '');
            const [phone, setPhone] = useState(device?.phone || '');
            const [deviceModel, setDeviceModel] = useState(device?.deviceModel || '');
            const [passcode, setPasscode] = useState(device?.passcode || '');
            const [priority, setPriority] = useState(device?.priority || 'normal');
            const [technician, setTechnician] = useState(defaultTech);

            // Brand & Model Selector State
            const [selectedBrandId, setSelectedBrandId] = useState('apple');
            const [modelSearchQuery, setModelSearchQuery] = useState('');

            // Multi-Faults State
            const initialFaults = useMemo(() => {
                if (device?.selectedFaults && Array.isArray(device.selectedFaults) && device.selectedFaults.length > 0) {
                    return device.selectedFaults;
                }
                if (device?.tags && Array.isArray(device.tags) && device.tags.length > 0) {
                    return device.tags;
                }
                if (device?.issue && typeof device.issue === 'string') {
                    // Split on + or return as single item if not empty
                    return device.issue.split('+').map(s => s.trim()).filter(Boolean);
                }
                return [];
            }, [device]);

            const FAULT_CATEGORIES = [
                { id: 'all', key: 'category_all', labelAr: 'الكل' },
                { id: 'screens', key: 'category_screens', labelAr: 'شاشات' },
                { id: 'battery', key: 'category_battery_charging', labelAr: 'بطارية وشحن' },
                { id: 'board', key: 'category_board_power', labelAr: 'مازربورد وباور' },
                { id: 'audio', key: 'category_audio_camera', labelAr: 'صوت وكاميرا' },
                { id: 'buttons', key: 'category_buttons_sensors', labelAr: 'أزرار وحساسات' },
                { id: 'chassis', key: 'category_chassis_frame', labelAr: 'هيكل وشاسيه' },
                { id: 'network', key: 'category_network_connectivity', labelAr: 'شبكة واتصال' },
                { id: 'software', key: 'category_software', labelAr: 'سوفتوير' }
            ];

            const [selectedFaults, setSelectedFaults] = useState(initialFaults);
            const [faultCategory, setFaultCategory] = useState('all');
            const [faultFilterSearch, setFaultFilterSearch] = useState('');
            const [customFaultInput, setCustomFaultInput] = useState('');
            const [issueNotes, setIssueNotes] = useState(device?.issueNotes || '');

            // Spare Parts & Multi-Supplier Sourcing State
            const initialPartsList = useMemo(() => {
                if (device?.partsList && Array.isArray(device.partsList) && device.partsList.length > 0) {
                    return device.partsList.map((p, idx) => ({
                        id: p.id || `part-${Date.now()}-${idx}-${Math.random().toString(36).substr(2, 5)}`,
                        name: p.name || '',
                        source: p.source || 'in_stock',
                        supplier: p.supplier || '',
                        cost: p.cost !== undefined ? p.cost : '',
                        isPaid: p.isPaid !== undefined ? p.isPaid : true
                    }));
                }
                // Legacy fallback if device had old single parts fields
                if (device?.partsUsed || device?.partSupplier || device?.partsCost) {
                    return [{
                        id: `part-${Date.now()}-legacy`,
                        name: device.partsUsed || t('unnamedPartFallback'),
                        source: device.partSource || (device.partSupplier ? 'purchased_external' : 'in_stock'),
                        supplier: device.partSupplier || '',
                        cost: device.partPurchasePrice !== undefined ? device.partPurchasePrice : (device.partsCost || ''),
                        isPaid: device.partPaidToSupplier !== undefined ? device.partPaidToSupplier : true
                    }];
                }
                return [];
            }, [device, t]);

            const [partsList, setPartsList] = useState(initialPartsList);
            const [repairCost, setRepairCost] = useState(device?.repairCost || '');

            // Part helper operations
            const handleAddPart = (partName = '') => {
                setPartsList(prev => [
                    ...prev,
                    {
                        id: `part-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                        name: partName,
                        source: 'in_stock',
                        supplier: '',
                        cost: '',
                        isPaid: true
                    }
                ]);
            };

            const handleRemovePart = (id) => {
                setPartsList(prev => prev.filter(p => p.id !== id));
            };

            const handleUpdatePart = (id, field, value) => {
                setPartsList(prev => prev.map(p => {
                    if (p.id === id) {
                        const updated = { ...p, [field]: value };
                        if (field === 'source' && value === 'in_stock') {
                            updated.isPaid = true;
                        }
                        return updated;
                    }
                    return p;
                }));
            };

            const handleAddQuickPart = (partName) => {
                setPartsList(prev => {
                    if (prev.length > 0 && !prev[prev.length - 1].name.trim()) {
                        const copy = [...prev];
                        copy[copy.length - 1] = { 
                            ...copy[copy.length - 1], 
                            name: partName,
                            source: 'purchased_external'
                        };
                        return copy;
                    }
                    return [
                        ...prev,
                        {
                            id: `part-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                            name: partName,
                            source: 'purchased_external',
                            supplier: '',
                            cost: '',
                            isPaid: false
                        }
                    ];
                });
            };

            // Calculated Totals for parts
            const totalPartsCost = useMemo(() => {
                return partsList.reduce((sum, p) => sum + (Number(p.cost) || 0), 0);
            }, [partsList]);

            const totalUnpaidSupplierDebt = useMemo(() => {
                return partsList
                    .filter(p => p.source === 'purchased_external' && !p.isPaid)
                    .reduce((sum, p) => sum + (Number(p.cost) || 0), 0);
            }, [partsList]);

            // Toggle fault in/out of selectedFaults
            const toggleFault = (faultLabel) => {
                setSelectedFaults(prev => 
                    prev.includes(faultLabel) 
                        ? prev.filter(f => f !== faultLabel) 
                        : [...prev, faultLabel]
                );
            };

            const removeFault = (faultLabel) => {
                setSelectedFaults(prev => prev.filter(f => f !== faultLabel));
            };

            const handleAddCustomFault = () => {
                const trimmed = customFaultInput.trim();
                if (!trimmed) return;
                if (!selectedFaults.includes(trimmed)) {
                    setSelectedFaults(prev => [...prev, trimmed]);
                }
                setCustomFaultInput('');
            };

            // Instant Model Search Filter across all brands
            const allModelsFlat = useMemo(() => {
                const list = [];
                BRANDS_DATABASE.forEach(b => {
                    b.categories.forEach(cat => {
                        cat.models.forEach(m => {
                            list.push({ brandId: b.id, brandName: b.name, model: m });
                        });
                    });
                });
                return list;
            }, []);

            const filteredSearchResults = useMemo(() => {
                if (!modelSearchQuery.trim()) return [];
                const q = modelSearchQuery.toLowerCase().trim();
                return allModelsFlat.filter(item => 
                    item.model.toLowerCase().includes(q) || 
                    item.brandName.toLowerCase().includes(q)
                );
            }, [modelSearchQuery, allModelsFlat]);

            const selectedBrand = useMemo(() => {
                return BRANDS_DATABASE.find(b => b.id === selectedBrandId) || BRANDS_DATABASE[0];
            }, [selectedBrandId]);

            // Filtered Faults
            const filteredFaultsList = useMemo(() => {
                let list = COMPREHENSIVE_FAULTS_LIST;
                if (faultCategory !== 'all') {
                    const catObj = FAULT_CATEGORIES.find(c => c.id === faultCategory);
                    if (catObj) {
                        list = list.filter(f => f.category === catObj.labelAr);
                    }
                }
                if (faultFilterSearch.trim()) {
                    const q = faultFilterSearch.toLowerCase().trim();
                    list = list.filter(f => f.label.toLowerCase().includes(q) || f.category.toLowerCase().includes(q));
                }
                return list;
            }, [faultCategory, faultFilterSearch]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!customerName || !deviceModel || !phone) return;

                const fallbackIssue = t('generalInspectionFallback');
                const finalIssue = selectedFaults.length > 0 
                    ? selectedFaults.join(' + ') + (issueNotes.trim() ? ` [${issueNotes.trim()}]` : '')
                    : (issueNotes.trim() || fallbackIssue);

                // Normalize partsList
                const fallbackPartName = t('unnamedPartFallback');
                const cleanPartsList = partsList
                    .filter(p => p.name.trim() || Number(p.cost) > 0 || p.supplier.trim())
                    .map(p => ({
                        id: p.id,
                        name: p.name.trim() || fallbackPartName,
                        source: p.source,
                        supplier: p.source === 'purchased_external' ? p.supplier.trim() : '',
                        cost: Number(p.cost) || 0,
                        isPaid: p.source === 'purchased_external' ? !!p.isPaid : true
                    }));

                const finalPartsCost = cleanPartsList.reduce((sum, p) => sum + p.cost, 0);
                const derivedPartsUsed = cleanPartsList.map(p => p.name).join(' + ');
                const hasExternal = cleanPartsList.some(p => p.source === 'purchased_external');
                const suppliersArray = [...new Set(cleanPartsList.filter(p => p.source === 'purchased_external' && p.supplier).map(p => p.supplier))];
                const allPaid = cleanPartsList.filter(p => p.source === 'purchased_external').every(p => p.isPaid);

                const ticketData = {
                    id: device ? device.id : nextId,
                    customerName: customerName.trim(),
                    phone: phone.trim(),
                    deviceModel: deviceModel.trim(),
                    issue: finalIssue,
                    selectedFaults,
                    issueNotes: issueNotes.trim(),
                    passcode: passcode || (isRtl ? 'لا يوجد' : 'None'),
                    priority,
                    status: device ? device.status : 'new',
                    technician,
                    repairCost: Number(repairCost) || 0,
                    partsCost: finalPartsCost,
                    partsList: cleanPartsList,
                    // Backward compatible fields
                    partsUsed: derivedPartsUsed,
                    partSource: hasExternal ? 'purchased_external' : 'in_stock',
                    partSupplier: suppliersArray.join('، '),
                    partPurchasePrice: finalPartsCost,
                    partPaidToSupplier: allPaid,
                    tags: selectedFaults.length > 0 ? selectedFaults : [],
                    isOverdue: device ? device.isOverdue : false,
                    createdAt: device ? device.createdAt : new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                onSave(ticketData);
            };

            const calculatedProfit = (Number(repairCost) || 0) - totalPartsCost;

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto" dir={isRtl ? 'rtl' : 'ltr'}>
                    <div className="bg-darkCard border border-darkBorder rounded-2xl max-w-3xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden my-auto">
                        {/* Header */}
                        <div className="p-4 md:p-5 border-b border-darkBorder flex items-center justify-between bg-darkCardSecondary/50">
                            <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-sm shadow">
                                    <i className="fa-solid fa-mobile-screen-button"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-black text-white">
                                        {isEdit ? `${t('editTicket')} #${device.id}` : `${t('intakeModalTitleNew')} #${nextId}`}
                                    </h3>
                                    <p className="text-xs text-gray-400">{t('intakeModalDesc')}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white p-2 text-base">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Form Body */}
                        <form onSubmit={handleSubmit} className="p-3 sm:p-5 overflow-y-auto space-y-4 text-xs">

        /* -------------------------------------------------------------
           WHATSAPP MODAL COMPONENT (With RIB option & respectful message)
           ------------------------------------------------------------- */
        function WhatsAppModal({ device, settings, onClose, onSend, currentLang = 'ar' }) {
            const t = (key, params) => (window.getTranslation ? window.getTranslation(key, currentLang, params) : key);
            const isRtl = (window.SUPPORTED_LANGUAGES && window.SUPPORTED_LANGUAGES[currentLang]?.dir === 'rtl') || currentLang === 'ar';

            const [includeRib, setIncludeRib] = useState(settings.includeRibInWhatsApp);
            const [customNote, setCustomNote] = useState('');

            // Generate multilingual message preview
            const preview = useMemo(() => {
                const custName = device.customerName;
                const model = device.deviceModel;
                const ticketId = device.id;
                const cost = device.repairCost || 0;
                const rib = settings.rib;
                const workshop = settings.workshopName;

                if (currentLang === 'fr') {
                    let msg = `Bonjour cher(e) client(e) *${custName}*,\n`;
                    if (device.status === 'ready') {
                        msg += `L'atelier *${workshop}* vous informe que votre appareil *${model}* (Ticket: *#${ticketId}*) a été réparé avec succès et est *prêt à être récupéré* dès maintenant ✅.\n\n`;
                        msg += `💰 Montant dû: *${cost} ${settings.currency}*\n`;
                    } else if (device.status === 'in_progress') {
                        msg += `Nous vous informons que votre appareil *${model}* (Ticket: *#${ticketId}*) est actuellement *en cours de diagnostic et réparation* à l'atelier *${workshop}* 🛠️.\n`;
                    } else if (device.status === 'waiting_parts') {
                        msg += `Concernant votre appareil *${model}* (Ticket: *#${ticketId}*) à l'atelier *${workshop}*:\nNous sommes en attente de réception de la pièce de rechange requise ⏳.\n`;
                    } else {
                        msg += `De la part de l'atelier *${workshop}* concernant votre appareil *${model}* (Ticket: *#${ticketId}*).\n`;
                    }

                    if (includeRib && rib) {
                        msg += `\n💳 *Pour le paiement par virement bancaire (RIB):*\n${rib}\n(Merci de nous envoyer le reçu une fois effectué)\n`;
                    }

                    if (customNote) {
                        msg += `\nNote: ${customNote}\n`;
                    }

                    msg += `\n📍 Bienvenue à l'atelier, et merci de votre confiance.`;
                    return msg;
                } else if (currentLang === 'en') {
                    let msg = `Hello dear customer *${custName}*,\n`;
                    if (device.status === 'ready') {
                        msg += `The *${workshop}* workshop informs you that your device *${model}* (Ticket: *#${ticketId}*) has been successfully repaired and is *ready for pickup* now ✅.\n\n`;
                        msg += `💰 Amount due: *${cost} ${settings.currency}*\n`;
                    } else if (device.status === 'in_progress') {
                        msg += `We would like to inform you that your device *${model}* (Ticket: *#${ticketId}*) is currently *in diagnosis and repair* at *${workshop}* 🛠️.\n`;
                    } else if (device.status === 'waiting_parts') {
                        msg += `Regarding your device *${model}* (Ticket: *#${ticketId}*) at *${workshop}*:\nWe are awaiting delivery of the required replacement part ⏳.\n`;
                    } else {
                        msg += `From *${workshop}* workshop regarding your device *${model}* (Ticket: *#${ticketId}*).\n`;
                    }

                    if (includeRib && rib) {
                        msg += `\n💳 *For bank transfer payment (RIB/IBAN):*\n${rib}\n(Please send receipt once completed)\n`;
                    }

                    if (customNote) {
                        msg += `\nNote: ${customNote}\n`;
                    }

                    msg += `\n📍 Welcome to our workshop, and thank you for trusting us.`;
                    return msg;
                }

                // Default Arabic
                let msg = `السلام عليكم أخي الكريم ${custName}،\n`;
                if (device.status === 'ready') {
                    msg += `نخبركم من ورشة *${workshop}* أن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) قد تم إصلاحه بنجاح وهو *جاهز للاستلام* الآن ✅.\n\n`;
                    msg += `💰 المبلغ المطلوب: *${cost} ${settings.currency}*\n`;
                } else if (device.status === 'in_progress') {
                    msg += `نحيطكم علماً بأن جهازكم *${model}* (تذكرة: *#${ticketId}*) هو حالياً *قيد الفحص والإصلاح الدقيق* لدى ورشة *${workshop}* 🛠️.\n`;
                } else if (device.status === 'waiting_parts') {
                    msg += `بخصوص جهازكم *${model}* (تذكرة: *#${ticketId}*) لدى ورشة *${workshop}*:\nنحن بانتظار استلام قطعة الغيار الأصلية المطلوبة ⏳.\n`;
                } else {
                    msg += `معك ورشة *${workshop}* بخصوص جهازك *${model}* (تذكرة: *#${ticketId}*).\n`;
                }

                if (includeRib && rib) {
                    msg += `\n💳 *للدفع المباشر عبر التحويل البنكي (RIB):*\n${rib}\n(يرجى إرسال وصل التحويل عند إتمامه)\n`;
                }

                if (customNote) {
                    msg += `\nملاحظة: ${customNote}\n`;
                }

                msg += `\n📍 مرحباً بكم في الورشة، وشكراً لثقتكم بنا.`;
                return msg;
            }, [device, settings, includeRib, customNote, currentLang]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(preview);
                alert(t('copiedToClipboard'));
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" dir={isRtl ? 'rtl' : 'ltr'}>
                    <div className="bg-darkCard border border-darkBorder rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl">
                        <div className="flex items-center justify-between border-b border-darkBorder pb-3">
                            <div className="flex items-center gap-2 text-emerald-400">
                                <i className="fa-brands fa-whatsapp text-2xl"></i>
                                <h3 className="font-extrabold text-white text-base">{t('whatsappModalTitle')}</h3>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Customer overview */}
                        <div className="bg-darkBg p-3 rounded-xl border border-darkBorder flex items-center justify-between text-xs">
                            <div>
                                <span className="font-bold text-white block">{device.customerName}</span>
                                <span className="text-gray-400 font-mono">{device.phone}</span>
                            </div>
                            <div className={isRtl ? 'text-left' : 'text-right'}>
                                <span className="font-mono text-emerald-400 font-bold block">{device.deviceModel}</span>
                                <span className="text-[10px] text-gray-500">#{device.id}</span>
                            </div>
                        </div>

                        {/* RIB Option Checkbox */}
                        <div className="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl space-y-1">
                            <label className="flex items-center gap-2 text-xs font-bold text-emerald-300 cursor-pointer">
                                <input
                                    type="checkbox"
                                    checked={includeRib}
                                    onChange={(e) => setIncludeRib(e.target.checked)}
                                    className="rounded bg-darkBg border-darkBorder text-emerald-500 w-4 h-4 cursor-pointer"
                                />
                                <span>{t('includeRibCheckbox')}</span>
                            </label>
                            {includeRib && (
                                <p className={`text-[11px] text-gray-400 font-mono ${isRtl ? 'pr-6' : 'pl-6'}`}>
                                    {t('ribAccountLabel', { rib: settings.rib || (isRtl ? 'يرجى إدخال الـ RIB في الإعدادات' : 'Please configure RIB in settings') })}
                                </p>
                            )}
                        </div>

                        {/* Custom note */}
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1">{t('customNoteLabel')}</label>
                            <input
                                type="text"
                                value={customNote}
                                onChange={(e) => setCustomNote(e.target.value)}
                                placeholder={t('customNotePlaceholder')}
                                className="w-full bg-darkBg border border-darkBorder rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                            />
                        </div>

                        {/* Preview Box */}
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1">{t('messagePreviewLabel')}</label>
                            <div className={`bg-darkBg/90 border border-darkBorder rounded-xl p-3 text-xs text-gray-300 whitespace-pre-line font-sans max-h-48 overflow-y-auto leading-relaxed ${isRtl ? 'border-r-2 border-r-emerald-500' : 'border-l-2 border-l-emerald-500'}`}>
                                {preview}
                            </div>
                        </div>

                        {/* Buttons */}
                        <div className="flex items-center justify-between pt-2 gap-2">
                            <button
                                onClick={copyToClipboard}
                                className="px-3.5 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold transition flex items-center gap-1.5">
                                <i className="fa-solid fa-copy"></i>
                                <span>{t('copyTextBtn')}</span>
                            </button>

                            <button
                                onClick={() => onSend(customNote, includeRib)}
                                className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black transition flex items-center gap-2 shadow-lg shadow-emerald-950">
                                <i className="fa-brands fa-whatsapp text-sm"></i>
                                <span>{t('sendViaWhatsAppNow')}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

                            {/* Financial */}
                            <div className="bg-gray-50 p-3 rounded-xl border flex justify-between items-center">
                                <span className="font-bold text-xs text-gray-700">{t('receiptAgreedCostLabel')}</span>
                                <span className="text-base font-black text-emerald-700 font-mono">
                                    {device.repairCost} {settings.currency}
                                </span>
                            </div>

                            {/* Bank RIB on receipt if available */}
                            {settings.rib && (
                                <div className="p-2 rounded bg-gray-50 border text-[10px] space-y-0.5">
                                    <span className="font-bold text-gray-700 block">{t('receiptRibLabel')}</span>
                                    <span className="font-mono text-gray-900 block font-bold">{settings.rib}</span>
                                </div>
                            )}

                            {/* Terms */}
                            <div className="text-[9px] text-gray-500 space-y-1 pt-1 border-t">
                                <p>• {t('receiptTerm1')}</p>
                                <p>• {t('receiptTerm2')}</p>
                                <p>• {t('receiptTerm3')}</p>
                            </div>

                            <div className="pt-3 text-center text-xs font-bold text-gray-800">
                                {t('receiptThankYou')}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
