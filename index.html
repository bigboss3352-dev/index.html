        /* -------------------------------------------------------------
           BACKEND-READY DATA SERVICE LAYER (CircuitFixAPI)
           Standardized interface connected to server REST APIs with local fallback
           ------------------------------------------------------------- */
        const CircuitFixAPI = {
            async checkManagerAvailability(email) {
                try {
                    const res = await fetch(`/api/auth/check-manager?email=${encodeURIComponent(email || '')}`);
                    if (res.ok) {
                        return await res.json();
                    }
                } catch (e) {
                    console.warn('Server check-manager unavailable, checking local store:', e);
                }
                const users = JSON.parse(localStorage.getItem('circuitfix_users') || JSON.stringify(DEFAULT_USERS));
                const managers = users.filter(u => u.role === 'manager');
                const cleanEmail = (email || '').trim().toLowerCase();
                const found = cleanEmail ? managers.find(u => u.email && u.email.toLowerCase() === cleanEmail) : null;
                return {
                    exists: !!found,
                    emailVerified: found ? found.emailVerified !== false : false,
                    totalManagers: managers.length,
                    email: cleanEmail
                };
            },
            async sendRegistrationOtp({ fullName, workshopName, email, password }) {
                try {
                    const res = await fetch('/api/auth/send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, workshopName, email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.message || data.error || 'Failed to send OTP');
                    }
                    return data;
                } catch (e) {
                    console.warn('Server send-otp error, using fallback:', e);
                    const code = Math.floor(100000 + Math.random() * 900000).toString();
                    return {
                        success: true,
                        previewCode: code,
                        cooldownSeconds: 60,
                        expiresInSeconds: 600,
                        email
                    };
                }
            },
            async resendRegistrationOtp(email) {
                try {
                    const res = await fetch('/api/auth/resend-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.message || data.error || 'Failed to resend OTP');
                    }
                    return data;
                } catch (e) {
                    console.warn('Server resend-otp error, using fallback:', e);
                    const code = Math.floor(100000 + Math.random() * 900000).toString();
                    return {
                        success: true,
                        previewCode: code,
                        cooldownSeconds: 60,
                        email
                    };
                }
            },
            async verifyOtpAndActivateManager(email, otp, pendingData) {
                try {
                    const res = await fetch('/api/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, otp })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.message || data.error || 'Verification failed');
                    }
                    return data.user;
                } catch (e) {
                    console.warn('Server verify-otp error, activating locally:', e);
                    if (pendingData) {
                        return {
                            id: 'usr-mgr-' + Date.now(),
                            role: 'manager',
                            fullName: pendingData.fullName,
                            workshopName: pendingData.workshopName || 'CircuitFix Phone Repair',
                            email: email.trim().toLowerCase(),
                            password: pendingData.password,
                            emailVerified: true,
                            verifiedAt: new Date().toISOString(),
                            createdAt: new Date().toISOString()
                        };
                    }
                    throw e;
                }
            },
            async login(email, password, role = 'manager') {
                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, role })
                    });
                    const data = await res.json();
                    if (res.ok && data.user) {
                        return data.user;
                    }
                    if (data.error === 'unverified_email') {
                        const err = new Error(data.message || 'Email unverified');
                        err.code = 'unverified_email';
                        throw err;
                    }
                    if (!res.ok) {
                        const err = new Error(data.message || 'Login failed');
                        err.code = data.error;
                        throw err;
                    }
                } catch (e) {
                    if (e.code === 'unverified_email' || e.code === 'user_not_found') throw e;
                    console.warn('Server login fallback to local storage:', e);
                }
                const users = JSON.parse(localStorage.getItem('circuitfix_users') || JSON.stringify(DEFAULT_USERS));
                const cleanEmail = (email || '').trim().toLowerCase();
                const user = users.find(u => u.role === role && u.email && u.email.toLowerCase() === cleanEmail);
                if (!user) {
                    const err = new Error('الحساب غير مسجل في النظام');
                    err.code = 'user_not_found';
                    throw err;
                }
                if (user.password !== password.trim()) throw new Error('كلمة المرور غير صحيحة');
                if (user.role === 'manager' && user.emailVerified === false) {
                    const err = new Error('الحساب غير مفعل! يجب إتمام التحقق من البريد أولاً');
                    err.code = 'unverified_email';
                    throw err;
                }
                return user;
            },
            async registerManager(managerData) {
                const users = JSON.parse(localStorage.getItem('circuitfix_users') || JSON.stringify(DEFAULT_USERS));
                const cleanEmail = (managerData.email || '').trim().toLowerCase();
                if (users.some(u => u.email && u.email.toLowerCase() === cleanEmail)) {
                    throw new Error('البريد الإلكتروني مسجل مسبقاً');
                }
                users.push(managerData);
                localStorage.setItem('circuitfix_users', JSON.stringify(users));
                try {
                    await fetch('/api/users/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(users)
                    });
                } catch (err) {
                    // non-blocking
                }
                return managerData;
            },
            async createWorker(workerData) {
                const users = JSON.parse(localStorage.getItem('circuitfix_users') || JSON.stringify(DEFAULT_USERS));
                const cleanEmail = (workerData.email || '').trim().toLowerCase();
                if (users.some(u => u.email && u.email.toLowerCase() === cleanEmail)) {
                    throw new Error('البريد الإلكتروني مسجل مسبقاً');
                }
                users.push(workerData);
                localStorage.setItem('circuitfix_users', JSON.stringify(users));
                try {
                    await fetch('/api/users/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(users)
                    });
                } catch (err) {
                    // non-blocking
                }
                return workerData;
            },
            async getTickets() {
                return JSON.parse(localStorage.getItem('circuitfix_devices') || '[]');
            },
            async syncTickets(devices) {
                localStorage.setItem('circuitfix_devices', JSON.stringify(devices));
                return true;
            },
            async getInventory() {
                return JSON.parse(localStorage.getItem('circuitfix_inventory') || '[]');
            },
            async syncInventory(inventory) {
                localStorage.setItem('circuitfix_inventory', JSON.stringify(inventory));
                return true;
            }
        };

                                    <rect x="-6" y="-5" width="4" height="10" rx="1" fill={current.accent} />

                                    <line x1="-6" y1="0" x2="-14" y2="0" stroke={current.primary} strokeWidth="1" />

                                <g transform="translate(210, 50)">

                                    <rect x="2" y="-4" width="4" height="8" rx="0.8" fill={current.primary} />
                                    <text x="0" y="11" fill={current.secondary} fontSize="4.5" fontFamily="monospace" textAnchor="middle">R10K</text>

                                    <rect x="-4" y="-6" width="8" height="4" rx="0.8" fill={current.accent} />
                                    <rect x="-4" y="2" width="8" height="4" rx="0.8" fill={current.accent} />
                                    <text x="14" y="2" fill={current.primary} fontSize="4.5" fontFamily="monospace">C22u</text>

                                <g transform="translate(100, 450)">
                                    <rect x="-5" y="-3" width="3" height="6" fill={current.secondary} />
                                    <rect x="2" y="-3" width="3" height="6" fill={current.secondary} />
                                    <text x="0" y="11" fill={current.secondary} fontSize="4.5" fontFamily="monospace" textAnchor="middle">R470</text>
                                </g>

                                {/* ============ SOLDER VIAS & TEST POINTS ============ */}
                                {[
                                    [120, 35, 'TP_VCC'], [155, 70, '3V3'], [245, 70, 'SDA'], [280, 35, 'SCL'],
                                    [35, 140, 'GND'], [70, 175, 'VBAT'], [70, 390, 'INT'], [35, 425, 'RST'],
                                    [175, 70, 'CLK'], [215, 83, 'MISO'], [415, 70, 'MOSI'], [480, 520, 'TXD'],
                                    [120, 530, 'RXD'], [530, 180, '5V_IN'], [510, 430, 'USB_DP'], [460, 480, 'USB_DM'],
                                    [90, 280, 'TP1'], [170, 320, 'TP2'], [380, 560, 'GND_PAD'], [560, 310, 'VBUS']
                                ].map(([vx, vy, lbl], idx) => (
                                    <g key={'via-' + idx} transform={`translate(${vx}, ${vy})`}>
                                        <circle cx="0" cy="0" r="4.5" fill="#040812" stroke={current.primary} strokeWidth="1.5" />
                                        <circle cx="0" cy="0" r="1.8" fill={current.highlight} filter="url(#node-glow)" />
                                        <text x="6" y="-4" fill={current.accent} fontSize="5" fontFamily="monospace" opacity="0.85">{lbl}</text>
                                    </g>
                                ))}

                                {/* Ground Stitching Vias */}
                                {[
                                    [25, 25], [40, 25], [25, 40],
                                    [565, 25], [580, 25], [580, 40],
                                    [25, 565], [40, 580], [25, 580],
                                    [565, 580], [580, 565], [580, 580]
                                ].map(([gx, gy], gi) => (
                                    <circle key={'gnd-via-' + gi} cx={gx} cy={gy} r="2.2" fill="none" stroke={current.primary} strokeWidth="1" opacity="0.6" />
                                ))}

                                {/* Technical Silkscreen Markings */}
                                <g fill={current.primary} opacity="0.7" fontFamily="monospace" fontSize="6">
                                    <text x="25" y="592" letterSpacing="1">BOARD: CIRCUITFIX-PRO-REV4</text>
                                    <text x="440" y="592" letterSpacing="0.5">ESD PROTECTED / RoHS</text>
                                    <text x="35" y="95" transform="rotate(-90 35 95)">HIGH_SPEED_BUS_0</text>
                                    <text x="590" y="240" transform="rotate(-90 590 240)">RF_ANT_SHIELD</text>
                                </g>
                            </pattern>
                        </defs>

                        {/* Full Pattern Fill */}
                        <rect width="100%" height="100%" fill="url(#circuit-pattern)" />

                        {/* ============ LIVE ANIMATED SIGNAL PULSES ============ */}
                        {pulse && (
                            <g filter="url(#node-glow)">
                                <circle r="3.5" fill={current.highlight}>
                                    <animateMotion 
                                        path="M 0,35 L 120,35 L 155,70 L 245,70 L 280,35 L 600,35" 
                                        dur="4.5s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                                <circle r="3" fill={current.secondary}>
                                    <animateMotion 
                                        path="M 600,180 L 530,180 L 490,220 L 450,220 L 410,260 L 340,260" 
                                        dur="5.8s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                                <circle r="3.5" fill={current.accent}>
                                    <animateMotion 
                                        path="M 35,0 L 35,140 L 70,175 L 70,390 L 35,425 L 35,600" 
                                        dur="6.2s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                                <circle r="3" fill={current.highlight}>
                                    <animateMotion 
                                        path="M 0,280 L 90,280 L 130,320 L 170,320 L 210,360 L 210,480 L 180,510 L 0,510" 
                                        dur="7.4s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                            </g>
                        )}
                    </svg>

                    {/* Subtle Vignette & Scanline Overlay */}
                    <div 
                        className="absolute inset-0 pointer-events-none" 
                        style={{
                            background: 'radial-gradient(circle at 50% 50%, transparent 40%, rgba(5, 9, 17, 0.75) 100%)',
                        }}
                    />
                </div>
            );
        }

        /* -------------------------------------------------------------
           AUTHENTICATION & ROLES PORTAL COMPONENT
           ------------------------------------------------------------- */
        function AuthPortal({ users, setUsers, onLogin, settings, setSettings, showToast, currentLang = 'ar', onSelectLang }) {
            const t = (k, p) => getTranslation(k, currentLang, p);
            const isRtl = (AVAILABLE_LANGUAGES.find(l => l.code === currentLang)?.dir || 'rtl') === 'rtl';

            // Mode: 'role_selection' | 'manager_login' | 'manager_register' | 'worker_login' | 'forgot_password'
            const [mode, setMode] = useState('role_selection');
            const [regStep, setRegStep] = useState(1); // 1: Info, 2: OTP
            const [forgotStep, setForgotStep] = useState(1); // 1: Identifier, 2: OTP, 3: New Password
            const [forgotRole, setForgotRole] = useState('manager');

            // Form states
            const [managerLogin, setManagerLogin] = useState({ email: '', password: '', showPass: false, error: '' });
            const [loginAccountCheck, setLoginAccountCheck] = useState({
                checked: false,
                exists: false,
                checking: false,
                notVerified: false,
                notFoundEmail: ''
            });
            const [otpCooldown, setOtpCooldown] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const [managerReg, setManagerReg] = useState({
                fullName: '',
                workshopName: '',
                email: '',
                password: '',
                showPass: false,
                otpInput: '',
                generatedOtp: '',
                error: ''
            });

            const [workerLogin, setWorkerLogin] = useState({ email: '', password: '', showPass: false, error: '' });
            const [forgotState, setForgotState] = useState({
                email: '',
                targetUser: null,
                otpInput: '',
                generatedOtp: '',
                newPassword: '',
                confirmPassword: '',
                showPass: false,
                error: ''
            });

            // Resend OTP cooldown timer
            useEffect(() => {
                let timer = null;
                if (otpCooldown > 0) {
                    timer = setInterval(() => {
                        setOtpCooldown(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                }
                return () => {
                    if (timer) clearInterval(timer);
                };
            }, [otpCooldown]);

            // Availability check for manager account on login
            const handleCheckAvailability = async (emailToCheck) => {
                const targetEmail = (emailToCheck !== undefined ? emailToCheck : managerLogin.email).trim().toLowerCase();
                if (!targetEmail || !targetEmail.includes('@')) {
                    setLoginAccountCheck({ checked: false, exists: false, checking: false, notVerified: false, notFoundEmail: '' });
                    return;
                }
                setLoginAccountCheck(prev => ({ ...prev, checking: true }));
                try {
                    const result = await CircuitFixAPI.checkManagerAvailability(targetEmail);
                    setLoginAccountCheck({
                        checked: true,
                        exists: !!result.exists,
                        checking: false,
                        notVerified: result.exists && result.emailVerified === false,
                        notFoundEmail: result.exists ? '' : targetEmail
                    });
                } catch (err) {
                    setLoginAccountCheck({
                        checked: true,
                        exists: false,
                        checking: false,
                        notVerified: false,
                        notFoundEmail: targetEmail
                    });
                }
            };

            // Handlers
            const handleManagerLoginSubmit = async (e) => {
                e.preventDefault();
                const emailClean = (managerLogin.email || '').trim().toLowerCase();
                const passClean = managerLogin.password.trim();

                setIsSubmitting(true);
                setManagerLogin(prev => ({ ...prev, error: '' }));

                try {
                    const authenticatedUser = await CircuitFixAPI.login(emailClean, passClean, 'manager');
                    setIsSubmitting(false);
                    onLogin(authenticatedUser);
                } catch (err) {
                    setIsSubmitting(false);
                    if (err.code === 'unverified_email') {
                        setManagerLogin(prev => ({ ...prev, error: t('managerLogin_errUnverified') }));
                        setLoginAccountCheck({
                            checked: true,
                            exists: true,
                            checking: false,
                            notVerified: true,
                            notFoundEmail: ''
                        });
                        return;
                    }

                    if (err.code === 'user_not_found') {
                        setManagerLogin(prev => ({ ...prev, error: t('managerLogin_errNotFound') }));
                        setLoginAccountCheck({
                            checked: true,
                            exists: false,
                            checking: false,
                            notVerified: false,
                            notFoundEmail: emailClean
                        });
                        return;
                    }

                    setManagerLogin(prev => ({ ...prev, error: err.message || t('managerLogin_errPass') }));
                }
            };

            const handleManagerRegStep1 = async (e) => {
                e.preventDefault();
                const emailClean = managerReg.email.trim().toLowerCase();

                if (!managerReg.fullName.trim() || !managerReg.workshopName.trim() || !emailClean || !managerReg.password) {
                    setManagerReg(prev => ({ ...prev, error: 'يرجى تعبئة جميع الحقول المطلوبة' }));
                    return;
                }

                setIsSubmitting(true);
                setManagerReg(prev => ({ ...prev, error: '' }));

                try {
                    const avail = await CircuitFixAPI.checkManagerAvailability(emailClean);
                    if (avail.exists && avail.emailVerified !== false) {
                        setIsSubmitting(false);
                        setManagerReg(prev => ({ ...prev, error: t('managerReg_errExists') }));
                        return;
                    }

                    const response = await CircuitFixAPI.sendRegistrationOtp({
                        fullName: managerReg.fullName.trim(),
                        workshopName: managerReg.workshopName.trim(),
                        email: emailClean,
                        password: managerReg.password
                    });

                    setIsSubmitting(false);
                    setManagerReg(prev => ({
                        ...prev,
                        generatedOtp: response.previewCode || response.otp || '',
                        otpInput: '',
                        error: ''
                    }));
                    setOtpCooldown(response.cooldownSeconds || 60);
                    setRegStep(2);
                    showToast(t('otpSentToast', { email: emailClean }) || `تم إرسال رمز التحقق (OTP) إلى بريدك الإلكتروني: ${emailClean}`);
                } catch (err) {
                    setIsSubmitting(false);
                    setManagerReg(prev => ({ ...prev, error: err.message || 'فشل إرسال رمز التحقق' }));
                }
            };

            const handleResendOtp = async () => {
                if (otpCooldown > 0) return;
                setIsSubmitting(true);
                try {
                    const res = await CircuitFixAPI.resendRegistrationOtp(managerReg.email);
                    setIsSubmitting(false);
                    setOtpCooldown(res.cooldownSeconds || 60);
                    if (res.previewCode) {
                        setManagerReg(prev => ({ ...prev, generatedOtp: res.previewCode, error: '' }));
                    }
                    showToast(t('resendSuccessToast') || 'تم إرسال رمز تحقق جديد بنجاح إلى بريدك الإلكتروني.');
                } catch (err) {
                    setIsSubmitting(false);
                    setManagerReg(prev => ({ ...prev, error: err.message || 'فشل إعادة إرسال الرمز' }));
                }
            };

            const handleManagerRegStep2 = async (e) => {
                e.preventDefault();
                const cleanOtp = (managerReg.otpInput || '').trim();
                if (!cleanOtp) {
                    setManagerReg(prev => ({ ...prev, error: t('enterReceivedOtp') || 'يرجى إدخال رمز التحقق' }));
                    return;
                }

                setIsSubmitting(true);
                setManagerReg(prev => ({ ...prev, error: '' }));

                try {
                    const verifiedManager = await CircuitFixAPI.verifyOtpAndActivateManager(
                        managerReg.email,
                        cleanOtp,
                        managerReg
                    );

                    setIsSubmitting(false);
                    const updatedUsers = [...users.filter(u => u.id !== verifiedManager.id), verifiedManager];
                    setUsers(updatedUsers);
                    localStorage.setItem('circuitfix_users', JSON.stringify(updatedUsers));

                    if (verifiedManager.workshopName) {
                        setSettings(prev => ({ ...prev, workshopName: verifiedManager.workshopName }));
                    }

                    showToast(t('managerReg_successToast'));
                    onLogin(verifiedManager);
                } catch (err) {
                    setIsSubmitting(false);
                    setManagerReg(prev => ({ ...prev, error: err.message || t('managerReg_errOtp') }));
                }
            };

            const handleWorkerLoginSubmit = (e) => {
                e.preventDefault();
                const emailClean = (workerLogin.email || '').trim().toLowerCase();
                const passClean = (workerLogin.password || '').trim();

                // Check worker by email
                const found = users.find(u => 
                    u.role === 'worker' && 
                    u.email && u.email.toLowerCase() === emailClean
                );

                if (!found) {
                    setWorkerLogin(prev => ({
                        ...prev,
                        error: t('workerLogin_errNotFound')
                    }));
                    return;
                }

                if (found.password !== passClean) {
                    setWorkerLogin(prev => ({
                        ...prev,
                        error: t('workerLogin_errPass')
                    }));
                    return;
                }

                setWorkerLogin(prev => ({ ...prev, error: '' }));
                onLogin(found);
            };

            const handleForgotStep1 = (e) => {
                e.preventDefault();
                const emailClean = (forgotState.email || '').trim().toLowerCase();
                const found = users.find(u => 
                    u.role === forgotRole && 
                    u.email && u.email.toLowerCase() === emailClean
                );

                if (!found) {
                    setForgotState(prev => ({
                        ...prev,
                        error: t('forgot_errNotFound')
                    }));
                    return;
                }

                const otp = Math.floor(1000 + Math.random() * 9000).toString();
                setForgotState(prev => ({
                    ...prev,
                    targetUser: found,
                    generatedOtp: otp,
                    otpInput: '',
                    error: ''
                }));
                setForgotStep(2);
                showToast(t('forgotOtpSentToast') || `تم إرسال رمز استعادة كلمة السر (OTP) إلى بريدك الإلكتروني`);
            };

            const handleForgotStep2 = (e) => {
                e.preventDefault();
                if (forgotState.otpInput.trim() !== forgotState.generatedOtp) {
                    setForgotState(prev => ({ ...prev, error: t('forgot_errOtp') }));
                    return;
                }
                setForgotStep(3);
                setForgotState(prev => ({ ...prev, error: '' }));
            };

            const handleForgotStep3 = (e) => {
                e.preventDefault();
                if (forgotState.newPassword.length < 4) {
                    setForgotState(prev => ({ ...prev, error: t('forgot_errPassLength') }));
                    return;
                }
                if (forgotState.newPassword !== forgotState.confirmPassword) {
                    setForgotState(prev => ({ ...prev, error: t('forgot_errPassMismatch') }));
                    return;
                }

                const updatedUsers = users.map(u => {
                    if (u.id === forgotState.targetUser.id) {
                        return { ...u, password: forgotState.newPassword };
                    }
                    return u;
                });

                setUsers(updatedUsers);
                localStorage.setItem('circuitfix_users', JSON.stringify(updatedUsers));
                showToast(t('forgot_successToast'));
                
                if (forgotRole === 'manager') {
                    setMode('manager_login');
                    setManagerLogin(prev => ({ ...prev, email: forgotState.email, password: forgotState.newPassword, error: '' }));
                } else {
                    setMode('worker_login');
                    setWorkerLogin(prev => ({ ...prev, email: forgotState.email, password: forgotState.newPassword, error: '' }));
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative z-10 overflow-y-auto py-10" dir={isRtl ? 'rtl' : 'ltr'}>
                    <div className="w-full max-w-xl">
                        {/* Global Language Switcher Top Bar */}
                        <div className="flex justify-between items-center mb-3 px-2">
                            <div className="flex items-center gap-2 text-xs text-gray-400 font-semibold">
                                <i className="fa-solid fa-globe text-emerald-400"></i>
                                <span>{t('languageSettingsCard') || 'اللغة / Language'}</span>
                            </div>
                            <LanguageSwitcher currentLang={currentLang} onSelectLang={onSelectLang} />
                        </div>

                        {/* ================= 1. ROLE SELECTION SCREEN ================= */}
                        {mode === 'role_selection' && (
                            <div className={`bg-darkCard/90 backdrop-blur-xl border border-darkBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 animate-fade-in ${isRtl ? 'text-right' : 'text-left'}`}>
                                {/* Header / Brand */}
                                <div className="text-center space-y-2">
                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white mx-auto shadow-xl shadow-emerald-950/60 border border-emerald-400/30">
                                        <i className="fa-solid fa-microchip text-3xl"></i>
                                    </div>
                                    <h1 className="text-2xl sm:text-3xl font-black text-white tracking-wide flex items-center justify-center gap-2">
                                        <span>CircuitFix</span>
                                        <span className="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30 font-mono">{t('proBadge') || 'PRO'}</span>
                                    </h1>
                                    <p className="text-sm text-gray-300 font-medium max-w-md mx-auto">
                                        {t('appTagline')}
                                    </p>
                                    <div className="pt-2">
                                        <span className="text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-1 rounded-full font-bold">
                                            {t('selectRoleTitle')}
                                        </span>
                                    </div>
                                </div>

                                {/* Role Choice Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                                    {/* Card A: Manager */}
                                    <button
                                        type="button"
                                        id="role-btn-manager"
                                        onClick={() => {
                                            const hasManager = users.some(u => u.role === 'manager');
                                            if (!hasManager) {
                                                setMode('manager_register');
                                                setRegStep(1);
                                            } else {
                                                setMode('manager_login');
                                                setManagerLogin(prev => ({ ...prev, error: '' }));
                                            }
                                        }}
                                        className={`p-5 rounded-2xl bg-gradient-to-b from-emerald-950/40 to-darkBg/90 border-2 border-emerald-500/40 hover:border-emerald-400 hover:shadow-xl hover:shadow-emerald-950/50 transition-all ${isRtl ? 'text-right' : 'text-left'} group flex flex-col justify-between relative overflow-hidden`}
                                    >
                                        <div className={`absolute top-0 ${isRtl ? 'left-0' : 'right-0'} w-24 h-24 bg-emerald-500/10 rounded-full blur-xl pointer-events-none`}></div>
                                        <div>
                                            <div className="w-12 h-12 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl mb-3 group-hover:scale-110 transition">
                                                <i className="fa-solid fa-user-tie"></i>
                                            </div>
                                            <h3 className="text-lg font-black text-white group-hover:text-emerald-400 transition">
                                                {t('managerRoleTitle')}
                                            </h3>
                                            <p className="text-xs text-gray-400 mt-1.5 leading-relaxed">
                                                {t('managerRoleDesc')}
                                            </p>
                                        </div>
                                        <div className="pt-4 flex items-center justify-between text-xs font-bold text-emerald-400">
                                            <span>{t('enterOrNewAccount')}</span>
                                            <i className={`fa-solid ${isRtl ? 'fa-arrow-left group-hover:-translate-x-1' : 'fa-arrow-right group-hover:translate-x-1'} transition`}></i>
                                        </div>
                                    </button>

                                    {/* Card B: Worker */}
                                    <button
                                        type="button"
                                        id="role-btn-worker"
                                        onClick={() => { setMode('worker_login'); setWorkerLogin(prev => ({ ...prev, error: '' })); }}
                                        className={`p-5 rounded-2xl bg-gradient-to-b from-cyan-950/40 to-darkBg/90 border-2 border-cyan-500/40 hover:border-cyan-400 hover:shadow-xl hover:shadow-cyan-950/50 transition-all ${isRtl ? 'text-right' : 'text-left'} group flex flex-col justify-between relative overflow-hidden`}
                                    >
                                        <div className={`absolute top-0 ${isRtl ? 'left-0' : 'right-0'} w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none`}></div>
                                        <div>
                                            <div className="w-12 h-12 rounded-xl bg-cyan-600/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl mb-3 group-hover:scale-110 transition">
                                                <i className="fa-solid fa-wrench"></i>
                                            </div>
                                            <h3 className="text-lg font-black text-white group-hover:text-cyan-400 transition">
                                                {t('workerRoleTitle')}
                                            </h3>
                                            <p className="text-xs text-gray-400 mt-1.5 leading-relaxed">
                                                {t('workerRoleDesc')}
                                            </p>
                                        </div>
                                        <div className="pt-4 flex items-center justify-between text-xs font-bold text-cyan-400">
                                            <span>{t('enterWithCode')}</span>
                                            <i className={`fa-solid ${isRtl ? 'fa-arrow-left group-hover:-translate-x-1' : 'fa-arrow-right group-hover:translate-x-1'} transition`}></i>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ================= 2. MANAGER LOGIN SCREEN ================= */}
                        {mode === 'manager_login' && (
                            <div className={`bg-darkCard/90 backdrop-blur-xl border border-darkBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 animate-fade-in ${isRtl ? 'text-right' : 'text-left'}`}>
                                <div className="flex items-center justify-between border-b border-darkBorder pb-4">
                                    <button
                                        type="button"
                                        onClick={() => setMode('role_selection')}
                                        className="text-xs text-gray-400 hover:text-white flex items-center gap-1.5 transition"
                                    >
                                        <i className={`fa-solid ${isRtl ? 'fa-arrow-right' : 'fa-arrow-left'}`}></i>
                                        <span>{t('changeRole')}</span>
                                    </button>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                                            {t('managerPath')}
                                        </span>
                                    </div>
                                </div>

                                <div>
                                    <h2 className="text-2xl font-black text-white flex items-center gap-2">
                                        <i className="fa-solid fa-user-tie text-emerald-400"></i>
                                        <span>{t('managerLoginTitle')}</span>
                                    </h2>
                                    <p className="text-xs text-gray-400 mt-1">
                                        {t('managerLoginDesc')}
                                    </p>
                                </div>

                                {/* No Manager in System Prompt */}
                                {users.filter(u => u.role === 'manager').length === 0 && (
                                    <div className="p-3.5 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-300 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-circle-info text-emerald-400 text-sm"></i>
                                            <span>{t('firstManagerPrompt')}</span>
                                        </div>
                                        <button

                                    <button
                                        type="submit"

                                        <i className="fa-solid fa-arrow-right-to-bracket"></i>

                                <div className="border-t border-darkBorder/80 pt-3 text-center">
                                    <p className="text-[11px] text-gray-400 flex items-center justify-center gap-1.5">
                                        <i className="fa-solid fa-circle-info text-cyan-400"></i>
                                        <span>{t('workerAccountInfo')}</span>
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* ================= 5. FORGOT PASSWORD SCREEN ================= */}
                        {mode === 'forgot_password' && (
                            <div className={`bg-darkCard/90 backdrop-blur-xl border border-darkBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 animate-fade-in ${isRtl ? 'text-right' : 'text-left'}`}>
                                <div className="flex items-center justify-between border-b border-darkBorder pb-4">
                                    <button
                                        type="button"
                                        onClick={() => setMode(forgotRole === 'manager' ? 'manager_login' : 'worker_login')}
                                        className="text-xs text-gray-400 hover:text-white flex items-center gap-1.5 transition"
                                    >
                                        <i className={`fa-solid ${isRtl ? 'fa-arrow-right' : 'fa-arrow-left'}`}></i>
                                        <span>{t('cancelAndBack')}</span>

                                    <span className="text-xs font-bold text-amber-400 bg-amber-950/60 border border-amber-500/30 px-2.5 py-1 rounded-full">
                                        {t('passwordResetFor')} ({forgotRole === 'manager' ? (t('managerRoleTitle') || 'المدير') : (t('workerRoleTitle') || 'العامل')})

                                <div>
                                    <h2 className="text-2xl font-black text-white flex items-center gap-2">
                                        <i className="fa-solid fa-key text-amber-400"></i>

                                    <p className="text-xs text-gray-400 mt-1">
                                        {forgotStep === 1 && t('enterIdentifierDesc')}
                                        {forgotStep === 2 && t('enterOtpToVerifyDesc')}
                                        {forgotStep === 3 && t('setNewPasswordDesc')}
                                    </p>
                                </div>

                                {forgotState.error && (
                                    <div className="p-3 bg-rose-500/15 border border-rose-500/30 rounded-xl text-xs text-rose-300 flex items-center gap-2">
                                        <i className="fa-solid fa-circle-exclamation text-rose-400"></i>
                                        <span>{forgotState.error}</span>
                                    </div>
                                )}

                                {/* FORGOT STEP 1: Enter Identifier */}
                                {forgotStep === 1 && (
                                    <form onSubmit={handleForgotStep1} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-300 mb-1.5">
                                                {t('registeredEmailLabel')}
                                            </label>
                                            <input
                                                type="email"
                                                required
                                                value={forgotState.email}
                                                onChange={(e) => setForgotState({ ...forgotState, email: e.target.value, error: '' })}
                                                placeholder="user@example.com"
                                                className="w-full bg-darkBg border border-darkBorder rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 font-bold"
                                            />
                                        </div>
                                        <button
                                            type="submit"
                                            className="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-black rounded-xl transition shadow-lg shadow-amber-900/40 text-sm flex items-center justify-center gap-2"
                                        >
                                            <span>{t('sendOtpBtn')}</span>
                                            <i className={`fa-solid ${isRtl ? 'fa-arrow-left' : 'fa-arrow-right'}`}></i>
                                        </button>

                                {/* FORGOT STEP 2: Verify OTP */}
                                {forgotStep === 2 && (
                                    <form onSubmit={handleForgotStep2} className="space-y-4">
                                        <div className="bg-amber-950/40 border border-amber-500/40 p-4 rounded-2xl text-center space-y-2">
                                            <span className="text-xs text-amber-300 font-bold block">
                                                {t('yourDemoOtp')}
                                            </span>
                                            <span className="text-2xl font-mono font-black text-amber-400 tracking-widest bg-darkBg px-4 py-1 rounded-xl border border-amber-500/30 inline-block">
                                                {forgotState.generatedOtp}
                                            </span>
                                            <div>
                                                <button
                                                    type="button"
                                                    onClick={() => setForgotState(prev => ({ ...prev, otpInput: prev.generatedOtp }))}
                                                    className="text-xs text-amber-400 underline font-bold"

                                                    {t('autoFillOtp')}
                                                </button>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-300 mb-1.5 text-center">
                                                {t('enter4DigitOtp')}
                                            </label>
                                            <input
                                                type="text"
                                                required
                                                maxLength={4}
                                                value={forgotState.otpInput}
                                                onChange={(e) => setForgotState({ ...forgotState, otpInput: e.target.value.replace(/[^0-9]/g, ''), error: '' })}
                                                placeholder="••••"
                                                className="w-full max-w-xs mx-auto block text-center tracking-[0.5em] text-2xl font-mono font-black bg-darkBg border border-darkBorder focus:border-amber-500 rounded-2xl py-2.5 text-white focus:outline-none"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            className="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-black rounded-xl transition shadow-lg shadow-amber-900/40 text-sm flex items-center justify-center gap-2"
                                        >
                                            <span>{t('verifyAndProceedBtn')}</span>
                                            <i className={`fa-solid ${isRtl ? 'fa-arrow-left' : 'fa-arrow-right'}`}></i>
                                        </button>
                                    </form>
                                )}

                                {/* FORGOT STEP 3: Set New Password */}
                                {forgotStep === 3 && (
                                    <form onSubmit={handleForgotStep3} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-300 mb-1">
                                                {t('newPasswordLabel')}
                                            </label>
                                            <input
                                                type={forgotState.showPass ? 'text' : 'password'}
                                                required
                                                minLength={4}
                                                value={forgotState.newPassword}
                                                onChange={(e) => setForgotState({ ...forgotState, newPassword: e.target.value, error: '' })}
                                                placeholder="••••••••"
                                                className="w-full bg-darkBg border border-darkBorder rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-bold"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-300 mb-1">
                                                {t('confirmPasswordLabel')}
                                            </label>
                                            <input
                                                type={forgotState.showPass ? 'text' : 'password'}
                                                required
                                                minLength={4}
                                                value={forgotState.confirmPassword}
                                                onChange={(e) => setForgotState({ ...forgotState, confirmPassword: e.target.value, error: '' })}
                                                placeholder="••••••••"
                                                className="w-full bg-darkBg border border-darkBorder rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500 font-bold"
                                            />
                                        </div>

                                        <div className="flex items-center gap-2">
                                            <input
                                                type="checkbox"
                                                id="forgotShowPass"
                                                checked={forgotState.showPass}
                                                onChange={(e) => setForgotState({ ...forgotState, showPass: e.target.checked })}
                                                className="rounded bg-darkBg border-darkBorder text-amber-500 focus:ring-amber-500 w-4 h-4 cursor-pointer"
                                            />
                                            <label htmlFor="forgotShowPass" className="text-xs text-gray-400 cursor-pointer">
                                                {t('showPasswords')}
                                            </label>
                                        </div>

                                        <button
                                            type="submit"
                                            className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl transition shadow-lg shadow-emerald-900/40 text-sm flex items-center justify-center gap-2"
                                        >
                                            <i className="fa-solid fa-floppy-disk"></i>
                                            <span>{t('saveNewPasswordBtn')}</span>
                                        </button>
                                    </form>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            // Users list (Manager & registered Workers)
            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('circuitfix_users');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return DEFAULT_USERS;
            });

            // Current logged-in user session (null shows the AuthPortal / Role Selection screen)
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('circuitfix_current_user');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return null;
            });

            // Role: 'manager' | 'worker' (derived from currentUser)
            const role = currentUser?.role || 'manager';

            // Current Language ('ar' | 'fr' | 'en')
            const [currentLang, setCurrentLang] = useState(() => {
                const saved = localStorage.getItem('circuitfix_lang');
                if (saved && (saved === 'ar' || saved === 'fr' || saved === 'en')) {
                    return saved;
                }
                return 'ar';
            });

            const handleSelectLang = (newLang) => {
                setCurrentLang(newLang);
                localStorage.setItem('circuitfix_lang', newLang);
                const isDirectionRtl = newLang === 'ar';
                document.documentElement.lang = newLang;
                document.documentElement.dir = isDirectionRtl ? 'rtl' : 'ltr';
                document.title = `${getTranslation('appName', newLang)} | ${getTranslation('appTagline', newLang)}`;
            };

            useEffect(() => {
                const isDirectionRtl = currentLang === 'ar';
                document.documentElement.lang = currentLang;
                document.documentElement.dir = isDirectionRtl ? 'rtl' : 'ltr';
                document.title = `${getTranslation('appName', currentLang)} | ${getTranslation('appTagline', currentLang)}`;
            }, [currentLang]);

            const t = (k, p) => getTranslation(k, currentLang, p);
            const isRtl = currentLang === 'ar';

            // Active Tab: 'dashboard' | 'tickets' | 'customers' | 'inventory' | 'workers' | 'settings'
            const [activeTab, setActiveTab] = useState('dashboard');

            // Workshop Settings
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('circuitfix_settings');
                if (saved) {
                    try { return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; } catch(e) { console.error(e); }
                }
                return DEFAULT_SETTINGS;
            });

            // Devices list with automatic partsList normalization for backward compatibility
            const [devices, setDevices] = useState(() => {
                const saved = localStorage.getItem('circuitfix_devices');
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed)) {
                            return parsed.map(dev => {
                                if ((!dev.partsList || !Array.isArray(dev.partsList) || dev.partsList.length === 0) && (dev.partsUsed || dev.partsCost || dev.partSupplier)) {
                                    return {
                                        ...dev,
                                        partsList: [{
                                            id: `part-${dev.id}-legacy`,
                                            name: dev.partsUsed || 'قطعة غيار مخصصة',
                                            source: dev.partSource || (dev.partSupplier ? 'purchased_external' : 'in_stock'),
                                            supplier: dev.partSupplier || '',
                                            cost: Number(dev.partPurchasePrice !== undefined ? dev.partPurchasePrice : dev.partsCost) || 0,
                                            isPaid: dev.partPaidToSupplier !== undefined ? dev.partPaidToSupplier : true
                                        }]
                                    };
                                }
                                return dev;
                            });
                        }
                    } catch(e) { console.error(e); }
                }
                return INITIAL_DEVICES;
            });

            // Inventory state
            const [inventory, setInventory] = useState(() => {
                const saved = localStorage.getItem('circuitfix_inventory');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return INITIAL_INVENTORY;
            });

            // Search & Filter
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [technicianFilter, setTechnicianFilter] = useState('all');

            // Modals
            const [showNewIntakeModal, setShowNewIntakeModal] = useState(false);
            const [editingDevice, setEditingDevice] = useState(null);
            const [whatsAppModalDevice, setWhatsAppModalDevice] = useState(null);
            const [receiptModalDevice, setReceiptModalDevice] = useState(null);
            const [deviceToDelete, setDeviceToDelete] = useState(null);
            const [workerToDelete, setWorkerToDelete] = useState(null);
            const [showAddWorkerModal, setShowAddWorkerModal] = useState(false);

            // New Worker form state
            const [newWorkerForm, setNewWorkerForm] = useState({
                fullName: '',
                email: '',
                specialty: 'تغيير الشاشات والبطاريات',
                password: ''
            });
            const [workerPassRevealed, setWorkerPassRevealed] = useState({});

            // Passcode visibility tracker by device ID
            const [revealedPasscodes, setRevealedPasscodes] = useState({});

            // Notification toast
            const [toast, setToast] = useState(null);

            // Save to localStorage
            useEffect(() => {
                localStorage.setItem('circuitfix_users', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('circuitfix_current_user', JSON.stringify(currentUser));
                    localStorage.setItem('circuitfix_role', currentUser.role);
                } else {
                    localStorage.removeItem('circuitfix_current_user');
                }
            }, [currentUser]);

            useEffect(() => {
                localStorage.setItem('circuitfix_settings', JSON.stringify(settings));
            }, [settings]);

            useEffect(() => {
                localStorage.setItem('circuitfix_devices', JSON.stringify(devices));
            }, [devices]);

            useEffect(() => {
                localStorage.setItem('circuitfix_inventory', JSON.stringify(inventory));
            }, [inventory]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                showToast('تم تسجيل الخروج بنجاح. يمكنك اختيار دورك مجدداً.');
            };

            const handleAddWorker = (e) => {
                e.preventDefault();
                const nameClean = newWorkerForm.fullName.trim();
                const emailClean = newWorkerForm.email.trim().toLowerCase();
                const passClean = newWorkerForm.password.trim();

                if (!nameClean || !emailClean || !passClean) {
                    showToast('يرجى ملء جميع الحقول المطلوبة (الاسم، البريد الإلكتروني، كلمة المرور)', 'error');
                    return;
                }

                const dup = users.find(u => u.email && u.email.toLowerCase() === emailClean);
                if (dup) {
                    showToast('البريد الإلكتروني هذا مسجل مسبقاً لعامل آخر أو مدير', 'error');
                    return;
                }

                const newWorker = {
                    id: 'usr-wrk-' + Date.now(),
                    role: 'worker',
                    managerId: currentUser?.id || 'usr-mgr-1',
                    fullName: nameClean,
                    email: emailClean,
                    password: passClean,
                    specialty: newWorkerForm.specialty || 'صيانة وتصليح الهواتف',
                    status: 'active',
                    createdAt: new Date().toISOString()
                };

                const updated = [...users, newWorker];
                setUsers(updated);
                showToast(`تمت إضافة التقني "${nameClean}" بنجاح وتعيين بيانات الدخول الخاصة به ✅`);
                setShowAddWorkerModal(false);

                setNewWorkerForm({
                    fullName: '',
                    email: '',
                    specialty: 'تغيير الشاشات والبطاريات',
                    password: ''
                });
            };

            const handleDeleteWorker = (workerId) => {
                const target = users.find(u => u.id === workerId);
                if (!target) return;
                setUsers(prev => prev.filter(u => u.id !== workerId));
                showToast(`تم حذف التقني "${target.fullName}" من قائمة العمال.`);
            };

            // Dynamically computed list of technicians for ticket assignment
            const activeWorkers = users.filter(u => u.role === 'worker');
            const availableTechnicians = [
                ...(currentUser?.role === 'manager' ? [currentUser.fullName] : ['يوسف السالمي']),
                ...activeWorkers.map(w => w.fullName)
            ];

            const togglePasscode = (id) => {
                setRevealedPasscodes(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            // Switch status of ticket
            const handleUpdateStatus = (deviceId, newStatus) => {
                setDevices(prev => prev.map(d => {
                    if (d.id === deviceId) {
                        return { ...d, status: newStatus, updatedAt: new Date().toISOString() };
                    }
                    return d;
                }));
                showToast(`تم تحديث تذكرة ${deviceId} إلى "${STATUS_CONFIG[newStatus].label}"`);
            };

            // Toggle supplier payment status for a specific part in a ticket
            const handleTogglePartPayment = (deviceId, partId) => {
                setDevices(prev => prev.map(d => {
                    if (d.id === deviceId) {
                        const updatedParts = (d.partsList || []).map(p => {
                            if (p.id === partId) {
                                return { ...p, isPaid: !p.isPaid };
                            }
                            return p;
                        });
                        const allExternalPaid = updatedParts.filter(p => p.source === 'purchased_external').every(p => p.isPaid);
                        return {
                            ...d,
                            partsList: updatedParts,
                            partPaidToSupplier: allExternalPaid
                        };
                    }
                    return d;
                }));
                showToast('تم تحديث حالة تسديد القطعة للمورد بنجاح ✅');
            };

            // Aggregated external parts across all tickets for the supplier ledger
            const allExternalPartsAcrossTickets = useMemo(() => {
                const list = [];
                devices.forEach(dev => {
                    const parts = dev.partsList && Array.isArray(dev.partsList) && dev.partsList.length > 0
                        ? dev.partsList
                        : (dev.partsUsed ? [{
                            id: `part-${dev.id}-legacy`,
                            name: dev.partsUsed,
                            source: dev.partSource || (dev.partSupplier ? 'purchased_external' : 'in_stock'),
                            supplier: dev.partSupplier || '',
                            cost: Number(dev.partPurchasePrice !== undefined ? dev.partPurchasePrice : dev.partsCost) || 0,
                            isPaid: dev.partPaidToSupplier !== undefined ? dev.partPaidToSupplier : true
                        }] : []);

                    parts.forEach(p => {
                        if (p.source === 'purchased_external' || (p.supplier && p.supplier.trim() !== '')) {
                            list.push({
                                deviceId: dev.id,
                                customerName: dev.customerName,
                                deviceModel: dev.deviceModel,
                                partId: p.id,
                                partName: p.name || 'قطعة غيار',
                                supplier: p.supplier || 'مورد خارجي',
                                cost: Number(p.cost) || 0,
                                isPaid: Boolean(p.isPaid),
                                ticketStatus: dev.status,
                                createdAt: dev.createdAt
                            });
                        }
                    });
                });
                return list;
            }, [devices]);

            // Delete ticket
            const handleDeleteDevice = () => {
                if (!deviceToDelete) return;
                setDevices(prev => prev.filter(d => d.id !== deviceToDelete.id));
                showToast(`تم حذف التذكرة ${deviceToDelete.id}`);
                setDeviceToDelete(null);
            };

            // Next Ticket ID generator
            const getNextTicketId = () => {
                const year = new Date().getFullYear();
                const nums = devices
                    .map(d => {
                        const match = d.id.match(/REP-\d+-(\d+)/);
                        return match ? parseInt(match[1], 10) : 0;
                    })
                    .filter(n => !isNaN(n));
                const nextNum = nums.length > 0 ? Math.max(...nums) + 1 : 105;
                return `REP-${year}-${nextNum}`;
            };

            // Filtered Devices
            const filteredDevices = useMemo(() => {
                return devices.filter(d => {
                    const q = searchQuery.trim().toLowerCase();
                    const matchesQuery = !q || (
                        d.id.toLowerCase().includes(q) ||
                        d.customerName.toLowerCase().includes(q) ||
                        d.phone.includes(q) ||
                        d.deviceModel.toLowerCase().includes(q) ||
                        d.issue.toLowerCase().includes(q) ||
                        (d.technician && d.technician.toLowerCase().includes(q))
                    );
                    const matchesStatus = statusFilter === 'all' || d.status === statusFilter;
                    const matchesTech = technicianFilter === 'all' || d.technician === technicianFilter;
                    return matchesQuery && matchesStatus && matchesTech;
                });

                const ready = devices.filter(d => d.status === 'ready').length;
                const delivered = devices.filter(d => d.status === 'delivered').length;
                const urgent = devices.filter(d => d.priority === 'urgent' && d.status !== 'delivered').length;

                // Total revenues
                const totalRevenue = devices.reduce((sum, d) => sum + (Number(d.repairCost) || 0), 0);
                const totalPartsCost = devices.reduce((sum, d) => sum + (Number(d.partsCost) || 0), 0);
                const netProfit = totalRevenue - totalPartsCost;

                // Stock alerts
                const lowStockCount = inventory.filter(item => item.quantity <= item.minAlert).length;

                return {
                    total,
                    inProgress,
                    waitingParts,
                    ready,
                    delivered,
                    urgent,
                    totalRevenue,
                    totalPartsCost,

                const ticketId = device.id;
                const cost = device.repairCost || 0;
                const rib = settings.rib;
                const workshop = settings.workshopName;

                if (device.status === 'ready') {
                    message += `${t('waReady', { workshop, model, ticketId })}\n\n`;
                    message += `💰 ${t('waRequiredAmount')}: *${cost} ${settings.currency}*\n`;
                } else if (device.status === 'in_progress') {
                    message += `${t('waInProgress', { workshop, model, ticketId })}\n`;
                } else if (device.status === 'waiting_parts') {
                    message += `${t('waWaitingParts', { workshop, model, ticketId })}\n`;
                } else {
                    message += `${workshop} - ${model} (#${ticketId})\n`;
                }

                // Add RIB if enabled
                if (includeRib && rib) {
                    message += `\n💳 *${t('waBankRibTitle')}*\n\`${rib}\`\n${t('waBankRibNote')}\n`;

                    message += `\n${isRtl ? 'ملاحظة إضافية' : 'Note'}: ${customText}\n`;

                                                        <i className="fa-solid fa-triangle-exclamation text-[9px]"></i>

                                                <div className="flex items-center gap-2 flex-1">
                                                    <span className="w-4 h-4 rounded-full bg-purple-950/80 border border-purple-500/40 text-[9px] text-purple-300 font-mono font-bold flex items-center justify-center shrink-0">
                                                        {pIdx + 1}

                                                <div className="flex flex-wrap items-center gap-1.5 text-[10px]">
                                                    {p.source === 'purchased_external' ? (
                                                        <>
                                                            <span className="px-2 py-0.5 rounded-md bg-amber-500/15 border border-amber-500/30 text-amber-300 font-medium flex items-center gap-1">
                                                                <i className="fa-solid fa-truck-ramp-box text-[9px]"></i>
                                                                <span>{t('supplierLabel')} <strong className="text-amber-200">{p.supplier || t('externalSupplier')}</strong></span>
                                                                <span className="font-mono font-bold mx-1">({p.cost || 0} {settings.currency})</span>
                                                            </span>
                                                            {p.isPaid ? (
                                                                <span className="px-2 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 font-bold flex items-center gap-1">
                                                                    <i className="fa-solid fa-circle-check text-[9px]"></i>
                                                                    <span>{t('paid')}</span>

                                                                    <i className="fa-solid fa-clock text-[9px]"></i>
                                                                    <span>{t('creditDebt')}</span>

                                                        <span className="px-2 py-0.5 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 font-medium flex items-center gap-1">
                                                            <i className="fa-solid fa-boxes-stacked text-[9px]"></i>
                                                            <span>{t('workshopStock')}</span>
                                                            {p.cost > 0 && <span className="font-mono text-gray-400 mx-1">({p.cost} {settings.currency})</span>}
                                                        </span>

                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    /* Legacy Single-Part view */
                                    <div>
                                        <div className="text-gray-300">
                                            <span>{device.partsUsed || t('customSparePart')}</span>
                                            <span className="text-gray-400 mx-2 font-mono font-bold">({device.partsCost || 0} {settings.currency})</span>
                                        </div>
                                        {device.partSource === 'purchased_external' && (
                                            <div className="flex flex-wrap items-center gap-1.5 pt-1 text-[10px]">
                                                <span className="px-2 py-0.5 rounded-md bg-amber-500/15 border border-amber-500/30 text-amber-300 font-bold flex items-center gap-1">
                                                    <i className="fa-solid fa-truck-ramp-box"></i>
                                                    <span>{t('supplierLabel')} {device.partSupplier || t('externalSupplier')}</span>
                                                    {device.partPurchasePrice ? <span className="font-mono">({device.partPurchasePrice} {settings.currency})</span> : null}

                                                        <i className="fa-solid fa-circle-check"></i>
                                                        <span>{t('paidToSupplier')}</span>
                                                    </span>
                                                ) : (
                                                    <span className="px-2 py-0.5 rounded-md bg-rose-500/15 border border-rose-500/30 text-rose-400 font-bold flex items-center gap-1 animate-pulse">
                                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                                        <span>{t('unpaidDebtBadge')}</span>
                                                    </span>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Right / Actions & Status changing sidebar */}
                    <div className={`bg-darkCardSecondary/40 p-4 border-t lg:border-t-0 ${isRtl ? 'lg:border-r' : 'lg:border-l'} border-darkBorder flex flex-col justify-between min-w-[240px] space-y-3`}>
                        {/* Current Status Badge */}
                        <div className="flex items-center justify-between">
                            <span className="text-[10px] text-gray-400 font-mono">{t('currentStatusLabel')}</span>
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border flex items-center gap-1.5 ${statusConf.color}`}>
                                <i className={`fa-solid ${statusConf.icon} text-[10px]`}></i>
                                <span>{localizedStatusLabel}</span>
                            </span>
                        </div>

                        {/* Quick action button depending on status */}
                        <div className="space-y-1.5">
                            {device.status === 'new' && (
                                <button
                                    onClick={() => onUpdateStatus('in_progress')}
                                    className="w-full py-2 px-3 bg-amber-600/20 hover:bg-amber-600 text-amber-300 hover:text-white border border-amber-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i className="fa-solid fa-screwdriver-wrench"></i>
                                    <span>{t('startRepairAction')}</span>
                                </button>

                                <button
                                    onClick={() => onUpdateStatus('ready')}
                                    className="w-full py-2 px-3 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i className="fa-solid fa-circle-check"></i>
                                    <span>{t('markReadyAction')}</span>
                                </button>
