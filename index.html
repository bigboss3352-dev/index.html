                                <g fill={current.primary} opacity="0.7" fontFamily="monospace" fontSize="6">
                                    <text x="25" y="592" letterSpacing="1">BOARD: CIRCUITFIX-PRO-REV4</text>
                                    <text x="440" y="592" letterSpacing="0.5">ESD PROTECTED / RoHS</text>
                                    <text x="35" y="95" transform="rotate(-90 35 95)">HIGH_SPEED_BUS_0</text>
                                    <text x="590" y="240" transform="rotate(-90 590 240)">RF_ANT_SHIELD</text>
                                </g>
                            </pattern>
                        </defs>

                        {/* Full Pattern Fill */}
                        <rect width="100%" height="100%" fill="url(#circuit-pattern)" />

                        {/* ============ LIVE ANIMATED SIGNAL PULSES ============ */}
                        {pulse && (
                            <g filter="url(#node-glow)">
                                <circle r="3.5" fill={current.highlight}>
                                    <animateMotion 
                                        path="M 0,35 L 120,35 L 155,70 L 245,70 L 280,35 L 600,35" 
                                        dur="4.5s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                                <circle r="3" fill={current.secondary}>
                                    <animateMotion 
                                        path="M 600,180 L 530,180 L 490,220 L 450,220 L 410,260 L 340,260" 
                                        dur="5.8s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                                <circle r="3.5" fill={current.accent}>
                                    <animateMotion 
                                        path="M 35,0 L 35,140 L 70,175 L 70,390 L 35,425 L 35,600" 
                                        dur="6.2s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                                <circle r="3" fill={current.highlight}>
                                    <animateMotion 
                                        path="M 0,280 L 90,280 L 130,320 L 170,320 L 210,360 L 210,480 L 180,510 L 0,510" 
                                        dur="7.4s" 
                                        repeatCount="indefinite" 
                                    />
                                </circle>
                            </g>
                        )}
                    </svg>

                    {/* Subtle Vignette & Scanline Overlay */}
                    <div 
                        className="absolute inset-0 pointer-events-none" 
                        style={{
                            background: 'radial-gradient(circle at 50% 50%, transparent 40%, rgba(5, 9, 17, 0.75) 100%)',
                        }}
                    />
                </div>
            );
        }

        /* -------------------------------------------------------------
           AUTHENTICATION & ROLES PORTAL COMPONENT
           ------------------------------------------------------------- */
        function AuthPortal({ users, setUsers, onLogin, settings, setSettings, showToast }) {
            // Mode: 'role_selection' | 'manager_login' | 'manager_register' | 'worker_login' | 'forgot_password'
            const [mode, setMode] = useState('role_selection');
            const [regStep, setRegStep] = useState(1); // 1: Info, 2: OTP
            const [forgotStep, setForgotStep] = useState(1); // 1: Identifier, 2: OTP, 3: New Password
            const [forgotRole, setForgotRole] = useState('manager');

            // Form states
            const [managerLogin, setManagerLogin] = useState({ identifier: '', password: '', showPass: false, error: '' });
            const [managerReg, setManagerReg] = useState({
                fullName: '',
                workshopName: '',
                phone: '',
                email: '',
                password: '',
                showPass: false,
                otpMethod: 'phone', // 'phone' | 'email'
                otpInput: '',
                generatedOtp: '',
                error: ''
            });

            const [workerLogin, setWorkerLogin] = useState({ identifier: '', secretCode: '', showPass: false, error: '' });
            const [forgotState, setForgotState] = useState({
                identifier: '',
                targetUser: null,
                otpInput: '',
                generatedOtp: '',
                newPassword: '',
                confirmPassword: '',
                showPass: false,
                error: ''
            });

            // Handlers
            const handleManagerLoginSubmit = (e) => {
                e.preventDefault();
                const idClean = managerLogin.identifier.trim();
                const passClean = managerLogin.password.trim();

                const found = users.find(u => 
                    u.role === 'manager' && 
                    (u.phone.replace(/[^0-9]/g, '') === idClean.replace(/[^0-9]/g, '') || u.email.toLowerCase() === idClean.toLowerCase())
                );

                if (!found) {
                    setManagerLogin(prev => ({ ...prev, error: 'لم يتم العثور على حساب مدير بهذا البريد أو رقم الهاتف. يمكنك إنشاء حساب جديد.' }));
                    return;
                }

                if (found.password !== passClean) {
                    setManagerLogin(prev => ({ ...prev, error: 'كلمة المرور غير صحيحة. حاول مجدداً أو استخدم استعادة كلمة المرور.' }));
                    return;
                }

                setManagerLogin(prev => ({ ...prev, error: '' }));
                onLogin(found);
            };

            const handleManagerRegStep1 = (e) => {
                e.preventDefault();
                const phoneClean = managerReg.phone.trim();
                const emailClean = managerReg.email.trim();

                // Check duplicates
                const exists = users.find(u => 
                    u.phone.replace(/[^0-9]/g, '') === phoneClean.replace(/[^0-9]/g, '') || 
                    (emailClean && u.email && u.email.toLowerCase() === emailClean.toLowerCase())
                );

                if (exists) {
                    setManagerReg(prev => ({ ...prev, error: 'هذا الرقم أو البريد الإلكتروني مسجل مسبقاً في النظام. يرجى تسجيل الدخول.' }));
                    return;
                }

                // Generate 4-digit OTP
                const code = Math.floor(1000 + Math.random() * 9000).toString();
                setManagerReg(prev => ({
                    ...prev,
                    generatedOtp: code,
                    otpInput: '',
                    error: ''
                }));
                setRegStep(2);
                showToast(`تم إرسال رمز التحقق (OTP) إلى ${managerReg.otpMethod === 'phone' ? managerReg.phone : managerReg.email}`);
            };

            const handleManagerRegStep2 = (e) => {
                e.preventDefault();
                if (managerReg.otpInput.trim() !== managerReg.generatedOtp) {
                    setManagerReg(prev => ({ ...prev, error: 'رمز التحقق غير صحيح. يرجى إدخال الرمز المعروض في الإشعار بدقة.' }));
                    return;
                }

                const newManager = {
                    id: 'usr-mgr-' + Date.now(),
                    role: 'manager',
                    fullName: managerReg.fullName.trim(),
                    workshopName: managerReg.workshopName.trim() || 'CircuitFix Phone Repair',
                    phone: managerReg.phone.trim(),
                    email: managerReg.email.trim(),
                    password: managerReg.password,
                    createdAt: new Date().toISOString()
                };

                const updatedUsers = [...users, newManager];
                setUsers(updatedUsers);
                localStorage.setItem('circuitfix_users', JSON.stringify(updatedUsers));

                if (newManager.workshopName) {
                    setSettings(prev => ({ ...prev, workshopName: newManager.workshopName }));
                }

                showToast('تم التحقق بنجاح وإنشاء حساب المدير ✅');
                onLogin(newManager);
            };

            const handleWorkerLoginSubmit = (e) => {
                e.preventDefault();
                const idClean = workerLogin.identifier.trim();
                const codeClean = workerLogin.secretCode.trim();

                // Check if phone or email exists for ANY worker
                const found = users.find(u => 
                    u.role === 'worker' && 
                    (u.phone.replace(/[^0-9]/g, '') === idClean.replace(/[^0-9]/g, '') || (u.email && u.email.toLowerCase() === idClean.toLowerCase()))
                );

                if (!found) {
                    setWorkerLogin(prev => ({
                        ...prev,
                        error: '❌ هذا الحساب غير مسجل من قِبل أي مدير ورشة. يرجى مراجعة صاحب الورشة ليقوم بإضافتك أولاً في قائمة العمال وتزويدك بالكود السري.'
                    }));
                    return;
                }

                if (found.password !== codeClean) {
                    setWorkerLogin(prev => ({
                        ...prev,
                        error: '❌ كلمة المرور أو الكود السري غير صحيح. يرجى التأكد من الرمز الذي استلمته من مدير الورشة.'
                    }));
                    return;
                }

                setWorkerLogin(prev => ({ ...prev, error: '' }));
                onLogin(found);
            };

            const handleForgotStep1 = (e) => {
                e.preventDefault();
                const idClean = forgotState.identifier.trim();
                const found = users.find(u => 
                    u.role === forgotRole && 
                    (u.phone.replace(/[^0-9]/g, '') === idClean.replace(/[^0-9]/g, '') || (u.email && u.email.toLowerCase() === idClean.toLowerCase()))
                );

                if (!found) {
                    setForgotState(prev => ({
                        ...prev,
                        error: `لم يتم العثور على حساب مسجل بهذا الرقم أو البريد لصفة ${forgotRole === 'manager' ? 'المدير' : 'العامل'}.`
                    }));
                    return;
                }

                const otp = Math.floor(1000 + Math.random() * 9000).toString();
                setForgotState(prev => ({
                    ...prev,
                    targetUser: found,
                    generatedOtp: otp,
                    otpInput: '',
                    error: ''
                }));
                setForgotStep(2);
                showToast(`تم إرسال رمز استعادة كلمة المرور المؤقت (OTP)`);
            };

            const handleForgotStep2 = (e) => {
                e.preventDefault();
                if (forgotState.otpInput.trim() !== forgotState.generatedOtp) {
                    setForgotState(prev => ({ ...prev, error: 'رمز التحقق غير صحيح. أدخل الرمز الظاهر في الإشعار.' }));
                    return;
                }
                setForgotStep(3);
                setForgotState(prev => ({ ...prev, error: '' }));
            };

            const handleForgotStep3 = (e) => {
                e.preventDefault();
                if (forgotState.newPassword.length < 4) {
                    setForgotState(prev => ({ ...prev, error: 'كلمة المرور يجب أن لا تقل عن 4 خانات.' }));
                    return;
                }
                if (forgotState.newPassword !== forgotState.confirmPassword) {
                    setForgotState(prev => ({ ...prev, error: 'كلمات المرور غير متطابقة.' }));
                    return;
                }

                const updatedUsers = users.map(u => {
                    if (u.id === forgotState.targetUser.id) {
                        return { ...u, password: forgotState.newPassword };
                    }
                    return u;
                });

                setUsers(updatedUsers);
                localStorage.setItem('circuitfix_users', JSON.stringify(updatedUsers));
                showToast('تم تحديث كلمة المرور بنجاح ✅ يمكنك الآن تسجيل الدخول.');
                
                if (forgotRole === 'manager') {
                    setMode('manager_login');
                    setManagerLogin(prev => ({ ...prev, identifier: forgotState.identifier, password: forgotState.newPassword, error: '' }));
                } else {
                    setMode('worker_login');
                    setWorkerLogin(prev => ({ ...prev, identifier: forgotState.identifier, secretCode: forgotState.newPassword, error: '' }));
                }
            };

            // Quick Demo Logins
            const loginAsDemoManager = () => {
                const demoMgr = users.find(u => u.role === 'manager') || users[0];
                showToast(`تم الدخول المباشر: حساب المدير (${demoMgr.fullName})`);
                onLogin(demoMgr);
            };

            const loginAsDemoWorker = () => {
                const demoWrk = users.find(u => u.role === 'worker') || users[1];
                showToast(`تم الدخول المباشر: حساب التقني (${demoWrk.fullName})`);
                onLogin(demoWrk);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative z-10 overflow-y-auto py-10">
                    <div className="w-full max-w-xl">
                        {/* ================= 1. ROLE SELECTION SCREEN ================= */}
                        {mode === 'role_selection' && (
                            <div className="bg-darkCard/90 backdrop-blur-xl border border-darkBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 animate-fade-in text-right">
                                {/* Header / Brand */}
                                <div className="text-center space-y-2">
                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white mx-auto shadow-xl shadow-emerald-950/60 border border-emerald-400/30">
                                        <i className="fa-solid fa-microchip text-3xl"></i>
                                    </div>
                                    <h1 className="text-2xl sm:text-3xl font-black text-white tracking-wide flex items-center justify-center gap-2">
                                        <span>CircuitFix</span>
                                        <span className="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30 font-mono">PRO</span>
                                    </h1>
                                    <p className="text-sm text-gray-300 font-medium max-w-md mx-auto">
                                        نظام إدارة ورشات تصليح الهواتف الذكية والأجهزة الإلكترونية
                                    </p>
                                    <div className="pt-2">
                                        <span className="text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-1 rounded-full font-bold">
                                            الرجاء اختيار صفتك للدخول إلى الورشة
                                        </span>
                                    </div>
                                </div>

                                {/* Role Choice Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                                    {/* Card A: Manager */}
                                    <button
                                        type="button"
                                        id="role-btn-manager"
                                        onClick={() => { setMode('manager_login'); setManagerLogin(prev => ({ ...prev, error: '' })); }}
                                        className="p-5 rounded-2xl bg-gradient-to-b from-emerald-950/40 to-darkBg/90 border-2 border-emerald-500/40 hover:border-emerald-400 hover:shadow-xl hover:shadow-emerald-950/50 transition-all text-right group flex flex-col justify-between relative overflow-hidden"
                                    >
                                        <div className="absolute top-0 left-0 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl pointer-events-none"></div>
                                        <div>
                                            <div className="w-12 h-12 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl mb-3 group-hover:scale-110 transition">
                                                <i className="fa-solid fa-user-tie"></i>
                                            </div>
                                            <h3 className="text-lg font-black text-white group-hover:text-emerald-400 transition">
                                                أنا مدير / صاحب الورشة
                                            </h3>
                                            <p className="text-xs text-gray-400 mt-1.5 leading-relaxed">
                                                إدارة شاملة للمحل، المداخيل، الأرباح، المخزون، وتعيين العمال وكلمات مرورهم.
                                            </p>
                                        </div>
                                        <div className="pt-4 flex items-center justify-between text-xs font-bold text-emerald-400">
                                            <span>دخول أو حساب جديد</span>
                                            <i className="fa-solid fa-arrow-left group-hover:-translate-x-1 transition"></i>
                                        </div>
                                    </button>

                                    {/* Card B: Worker */}
                                    <button
                                        type="button"
                                        id="role-btn-worker"
                                        onClick={() => { setMode('worker_login'); setWorkerLogin(prev => ({ ...prev, error: '' })); }}
                                        className="p-5 rounded-2xl bg-gradient-to-b from-cyan-950/40 to-darkBg/90 border-2 border-cyan-500/40 hover:border-cyan-400 hover:shadow-xl hover:shadow-cyan-950/50 transition-all text-right group flex flex-col justify-between relative overflow-hidden"
                                    >
                                        <div className="absolute top-0 left-0 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>
                                        <div>
                                            <div className="w-12 h-12 rounded-xl bg-cyan-600/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl mb-3 group-hover:scale-110 transition">
                                                <i className="fa-solid fa-wrench"></i>
                                            </div>
                                            <h3 className="text-lg font-black text-white group-hover:text-cyan-400 transition">
                                                أنا عامل / تقني صيانة
                                            </h3>
                                            <p className="text-xs text-gray-400 mt-1.5 leading-relaxed">
                                                متابعة تذاكر الصيانة المسندة، تحديث حالات الإصلاح وقطع الغيار، والعمليات الفنية.
                                            </p>
                                        </div>
                                        <div className="pt-4 flex items-center justify-between text-xs font-bold text-cyan-400">
                                            <span>دخول بالكود المسلّم</span>
                                            <i className="fa-solid fa-arrow-left group-hover:-translate-x-1 transition"></i>
                                        </div>
                                    </button>
                                </div>

                                {/* Instant Quick Demo Buttons */}
                                <div className="border-t border-darkBorder/80 pt-5 space-y-2.5">
                                    <p className="text-[11px] text-gray-400 text-center">
                                        ⚡ هل ترغب في تجربة النظام مباشرة؟ اختر أحد الحسابات التجريبية الجاهزة:
                                    </p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                        <button
                                            type="button"
                                            onClick={loginAsDemoManager}
                                            className="py-2.5 px-3 bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-500/30 rounded-xl text-emerald-300 font-bold flex items-center justify-center gap-2 transition"
                                        >
                                            <i className="fa-solid fa-bolt text-amber-400"></i>
                                            <span>تجربة كمدير ورشة (يوسف)</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={loginAsDemoWorker}
                                            className="py-2.5 px-3 bg-cyan-950/40 hover:bg-cyan-900/60 border border-cyan-500/30 rounded-xl text-cyan-300 font-bold flex items-center justify-center gap-2 transition"
                                        >
                                            <i className="fa-solid fa-wrench text-cyan-400"></i>
                                            <span>تجربة كتقني صيانة (إلياس)</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= 2. MANAGER LOGIN SCREEN ================= */}
                        {mode === 'manager_login' && (
                            <div className="bg-darkCard/90 backdrop-blur-xl border border-darkBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 animate-fade-in text-right">
                                <div className="flex items-center justify-between border-b border-darkBorder pb-4">
                                    <button
                                        type="button"
                                        onClick={() => setMode('role_selection')}
                                        className="text-xs text-gray-400 hover:text-white flex items-center gap-1.5 transition"
                                    >
                                        <i className="fa-solid fa-arrow-right"></i>
                                        <span>تغيير الدور</span>
                                    </button>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                                            مسار المدير
                                        </span>
                                    </div>
                                </div>

                                <div className="text-right">
                                    <h2 className="text-2xl font-black text-white flex items-center gap-2">
                                        <i className="fa-solid fa-user-tie text-emerald-400"></i>
                                        <span>تسجيل دخول صاحب الورشة</span>
                                    </h2>
                                    <p className="text-xs text-gray-400 mt-1">
                                        أدخل بريدك الإلكتروني أو رقم هاتفك وكلمة المرور للوصول إلى لوحة التحكم الإدارية.
                                    </p>
                                </div>

                                {managerLogin.error && (
                                    <div className="p-3 bg-rose-500/15 border border-rose-500/30 rounded-xl text-xs text-rose-300 flex items-center gap-2">
                                        <i className="fa-solid fa-circle-exclamation text-rose-400"></i>
                                        <span>{managerLogin.error}</span>
                                    </div>
                                )}

                                <form onSubmit={handleManagerLoginSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-300 mb-1.5">
                                            البريد الإلكتروني أو رقم الهاتف:
                                        </label>
                                        <div className="relative">
                                            <i className="fa-solid fa-envelope absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                                            <input
                                                type="text"
                                                required
                                                value={managerLogin.identifier}
                                                onChange={(e) => setManagerLogin({ ...managerLogin, identifier: e.target.value, error: '' })}
                                                placeholder="مثال: 0612345678 أو admin@circuitfix.com"
                                                className="w-full bg-darkBg border border-darkBorder rounded-xl pr-10 pl-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-bold"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex items-center justify-between mb-1.5">
                                            <label className="text-xs font-bold text-gray-300">
                                                كلمة المرور:
                                            </label>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setForgotRole('manager');
                                                    setForgotStep(1);
                                                    setForgotState(prev => ({ ...prev, identifier: managerLogin.identifier, error: '' }));
                                                    setMode('forgot_password');
                                                }}
                                                className="text-xs text-emerald-400 hover:underline"
                                            >
                                                نسيت كلمة المرور؟
                                            </button>
                                        </div>
                                        <div className="relative">
                                            <i className="fa-solid fa-lock absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                                            <input
                                                type={managerLogin.showPass ? 'text' : 'password'}
                                                required
                                                value={managerLogin.password}
                                                onChange={(e) => setManagerLogin({ ...managerLogin, password: e.target.value, error: '' })}
                                                placeholder="••••••••"
                                                className="w-full bg-darkBg border border-darkBorder rounded-xl pr-10 pl-10 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-bold"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setManagerLogin(prev => ({ ...prev, showPass: !prev.showPass }))}
                                                className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 text-xs"
                                            >
                                                <i className={`fa-solid ${managerLogin.showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        id="manager-login-submit-btn"
                                        className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl transition shadow-lg shadow-emerald-900/40 text-sm flex items-center justify-center gap-2"
                                    >
                                        <i className="fa-solid fa-arrow-right-to-bracket"></i>
                                        <span>دخول إلى لوحة المدير</span>
                                    </button>
                                </form>

                                <div className="border-t border-darkBorder/80 pt-4 flex items-center justify-between text-xs">
                                    <span className="text-gray-400">ليس لديك حساب ورشة مسجل؟</span>
                                    <button
                                        type="button"
                                        onClick={() => { setMode('manager_register'); setRegStep(1); setManagerReg(prev => ({ ...prev, error: '' })); }}
                                        className="text-emerald-400 font-bold hover:underline flex items-center gap-1"
                                    >
                                        <span>إنشاء حساب جديد (حصري للمدير)</span>
                                        <i className="fa-solid fa-arrow-left text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ================= 3. MANAGER REGISTER SCREEN (WITH OTP) ================= */}
                        {mode === 'manager_register' && (
                            <div className="bg-darkCard/90 backdrop-blur-xl border border-darkBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5 animate-fade-in text-right">
                                <div className="flex items-center justify-between border-b border-darkBorder pb-4">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            if (regStep === 2) setRegStep(1);
                                            else setMode('manager_login');
                                        }}
                                        className="text-xs text-gray-400 hover:text-white flex items-center gap-1.5 transition"
                                    >
                                        <i className="fa-solid fa-arrow-right"></i>
                                        <span>{regStep === 2 ? 'العودة للبيانات' : 'تسجيل الدخول'}</span>

                                                checked={forgotState.showPass}

                                        >
                                            <i className="fa-solid fa-floppy-disk"></i>

                    </div>

            );
        }

        function App() {
            // Users list (Manager & registered Workers)
            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('circuitfix_users');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return DEFAULT_USERS;
            });

            // Current logged-in user session (null shows the AuthPortal / Role Selection screen)
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('circuitfix_current_user');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return null;
            });

            // Role: 'manager' | 'worker' (derived from currentUser)
            const role = currentUser?.role || 'manager';

            // Active Tab: 'dashboard' | 'tickets' | 'customers' | 'inventory' | 'workers' | 'settings'
            const [activeTab, setActiveTab] = useState('dashboard');

            // Workshop Settings
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('circuitfix_settings');
                if (saved) {
                    try { return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; } catch(e) { console.error(e); }
                }
                return DEFAULT_SETTINGS;
            });

            // Devices list
            const [devices, setDevices] = useState(() => {
                const saved = localStorage.getItem('circuitfix_devices');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return INITIAL_DEVICES;
            });

            // Inventory state
            const [inventory, setInventory] = useState(() => {
                const saved = localStorage.getItem('circuitfix_inventory');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return INITIAL_INVENTORY;
            });

            // Search & Filter
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [technicianFilter, setTechnicianFilter] = useState('all');

            // Modals
            const [showNewIntakeModal, setShowNewIntakeModal] = useState(false);
            const [editingDevice, setEditingDevice] = useState(null);
            const [whatsAppModalDevice, setWhatsAppModalDevice] = useState(null);
            const [receiptModalDevice, setReceiptModalDevice] = useState(null);
            const [deviceToDelete, setDeviceToDelete] = useState(null);

            const [showAddWorkerModal, setShowAddWorkerModal] = useState(false);

            // New Worker form state

                phone: '',
                email: '',

            const [revealedPasscodes, setRevealedPasscodes] = useState({});

            // Notification toast
            const [toast, setToast] = useState(null);

            // Save to localStorage
            useEffect(() => {
                localStorage.setItem('circuitfix_users', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('circuitfix_current_user', JSON.stringify(currentUser));
                    localStorage.setItem('circuitfix_role', currentUser.role);
                } else {
                    localStorage.removeItem('circuitfix_current_user');
                }
            }, [currentUser]);

            useEffect(() => {
                localStorage.setItem('circuitfix_settings', JSON.stringify(settings));
            }, [settings]);

            useEffect(() => {
                localStorage.setItem('circuitfix_devices', JSON.stringify(devices));
            }, [devices]);

            useEffect(() => {
                localStorage.setItem('circuitfix_inventory', JSON.stringify(inventory));
            }, [inventory]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                showToast('تم تسجيل الخروج بنجاح. يمكنك اختيار دورك مجدداً.');

            const handleAddWorker = (e) => {
                e.preventDefault();
                const nameClean = newWorkerForm.fullName.trim();
                const phoneClean = newWorkerForm.phone.trim();
                const passClean = newWorkerForm.password.trim();

                if (!nameClean || !phoneClean || !passClean) {
                    showToast('يرجى ملء جميع الحقول المطلوبة', 'error');
                    return;
                }

                const dup = users.find(u => u.phone.replace(/[^0-9]/g, '') === phoneClean.replace(/[^0-9]/g, ''));
                if (dup) {
                    showToast('رقم الهاتف هذا مسجل مسبقاً لعامل آخر أو مدير', 'error');
                    return;
                }

                const newWorker = {
                    id: 'usr-wrk-' + Date.now(),
                    role: 'worker',
                    managerId: currentUser?.id || 'usr-mgr-1',
                    fullName: nameClean,
                    phone: phoneClean,
                    email: newWorkerForm.email.trim(),
                    password: passClean,
                    specialty: newWorkerForm.specialty,
                    status: 'active',
                    createdAt: new Date().toISOString()

                const updated = [...users, newWorker];
                setUsers(updated);
                showToast(`تمت إضافة التقني "${nameClean}" بنجاح وتعيين كود الدخول الخاص به ✅`);
                setShowAddWorkerModal(false);

                if (newWorkerForm.sendWhatsApp) {
                    const wsMsg = `مرحباً بك ${nameClean} في فريق ورشة ${settings.workshopName || 'CircuitFix'}!\nتم إنشاء حسابك التقني بنجاح:\n📱 رقم الهاتف للدخول: ${phoneClean}\n🔑 الكود السري / كلمة المرور: ${passClean}\nالتخصص: ${newWorkerForm.specialty}\nيمكنك الدخول الآن واختيار "أنا عامل / تقني" لبدء العمل ومتابعة الأجهزة.`;
                    const cleanPhone = phoneClean.replace(/[^0-9]/g, '');
                    const fullPhone = cleanPhone.startsWith('0') ? '212' + cleanPhone.slice(1) : cleanPhone;
                    window.open(`https://wa.me/${fullPhone}?text=${encodeURIComponent(wsMsg)}`, '_blank');
                }

                setNewWorkerForm({
                    fullName: '',
                    phone: '',
                    email: '',
                    specialty: 'تغيير الشاشات والبطاريات',
                    password: '',
                    sendWhatsApp: true
                });

            const handleDeleteWorker = (workerId) => {
                const target = users.find(u => u.id === workerId);
                if (!target) return;
                setUsers(prev => prev.filter(u => u.id !== workerId));
                showToast(`تم حذف التقني "${target.fullName}" من قائمة العمال.`);
            };

            // Dynamically computed list of technicians for ticket assignment
            const activeWorkers = users.filter(u => u.role === 'worker');
            const availableTechnicians = [
                ...(currentUser?.role === 'manager' ? [currentUser.fullName] : ['يوسف السالمي']),
                ...activeWorkers.map(w => w.fullName)
            ];

            const togglePasscode = (id) => {
                setRevealedPasscodes(prev => ({

                    [id]: !prev[id]

            };

            // Switch status of ticket
            const handleUpdateStatus = (deviceId, newStatus) => {
                setDevices(prev => prev.map(d => {
                    if (d.id === deviceId) {
                        return { ...d, status: newStatus, updatedAt: new Date().toISOString() };

                    return d;
                }));
                showToast(`تم تحديث تذكرة ${deviceId} إلى "${STATUS_CONFIG[newStatus].label}"`);

            // Delete ticket
            const handleDeleteDevice = () => {
                if (!deviceToDelete) return;
                setDevices(prev => prev.filter(d => d.id !== deviceToDelete.id));
                showToast(`تم حذف التذكرة ${deviceToDelete.id}`);
                setDeviceToDelete(null);
            };

            // Next Ticket ID generator
            const getNextTicketId = () => {
                const year = new Date().getFullYear();
                const nums = devices
                    .map(d => {
                        const match = d.id.match(/REP-\d+-(\d+)/);
                        return match ? parseInt(match[1], 10) : 0;
                    })
                    .filter(n => !isNaN(n));
                const nextNum = nums.length > 0 ? Math.max(...nums) + 1 : 105;
                return `REP-${year}-${nextNum}`;
            };

            // Filtered Devices
            const filteredDevices = useMemo(() => {
                return devices.filter(d => {
                    const q = searchQuery.trim().toLowerCase();
                    const matchesQuery = !q || (
                        d.id.toLowerCase().includes(q) ||
                        d.customerName.toLowerCase().includes(q) ||
                        d.phone.includes(q) ||
                        d.deviceModel.toLowerCase().includes(q) ||
                        d.issue.toLowerCase().includes(q) ||
                        (d.technician && d.technician.toLowerCase().includes(q))
                    );
                    const matchesStatus = statusFilter === 'all' || d.status === statusFilter;
                    const matchesTech = technicianFilter === 'all' || d.technician === technicianFilter;
                    return matchesQuery && matchesStatus && matchesTech;
                });
            }, [devices, searchQuery, statusFilter, technicianFilter]);

            // Financial & KPI Computations
            const stats = useMemo(() => {
                const total = devices.length;
                const inProgress = devices.filter(d => d.status === 'in_progress').length;
                const waitingParts = devices.filter(d => d.status === 'waiting_parts').length;
                const ready = devices.filter(d => d.status === 'ready').length;
                const delivered = devices.filter(d => d.status === 'delivered').length;
                const urgent = devices.filter(d => d.priority === 'urgent' && d.status !== 'delivered').length;

                // Total revenues
                const totalRevenue = devices.reduce((sum, d) => sum + (Number(d.repairCost) || 0), 0);
                const totalPartsCost = devices.reduce((sum, d) => sum + (Number(d.partsCost) || 0), 0);
                const netProfit = totalRevenue - totalPartsCost;

                // Stock alerts
                const lowStockCount = inventory.filter(item => item.quantity <= item.minAlert).length;

                return {
                    total,
                    inProgress,
                    waitingParts,
                    ready,
                    delivered,
                    urgent,
                    totalRevenue,
                    totalPartsCost,
                    netProfit,
                    lowStockCount
                };
            }, [devices, inventory]);

            // WhatsApp link generator with RIB and professional formatting
            const buildWhatsAppMessage = (device, customText = '', includeRib = settings.includeRibInWhatsApp) => {
                const custName = device.customerName;
                const model = device.deviceModel;
                const ticketId = device.id;
                const cost = device.repairCost || 0;
                const rib = settings.rib;
                const workshop = settings.workshopName;

                let message = `السلام عليكم أخي الكريم ${custName}،\n`;
                
                if (device.status === 'ready') {
                    message += `نخبركم من ورشة *${workshop}* أن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) قد تم إصلاحه بنجاح وهو *جاهز للاستلام* الآن ✅.\n\n`;
                    message += `💰 المبلغ المطلوب للإصلاح: *${cost} ${settings.currency}*\n`;
                } else if (device.status === 'in_progress') {
                    message += `نحيطكم علماً بأن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) هو حالياً *قيد الفحص والإصلاح* في ورشة *${workshop}* 🛠️.\n`;
                    message += `سنوافيكم بإشعار فوري عند اكتماله.\n`;
                } else if (device.status === 'waiting_parts') {
                    message += `بخصوص جهازكم *${model}* (تذكرة: *#${ticketId}*) لدى ورشة *${workshop}*:\n`;
                    message += `نحن بانتظار استلام قطعة الغيار الأصلية المطلوبة لضمان أعلى جودة ⏳.\n`;
                } else {
                    message += `معك ورشة *${workshop}* بخصوص جهازك *${model}* (تذكرة: *#${ticketId}*).\n`;
                }

                // Add RIB if enabled
                if (includeRib && rib) {
                    message += `\n💳 *للدفع المباشر عبر التحويل البنكي (RIB):*\n\`${rib}\`\n(يرجى إرسال وصل التحويل عند إتمامه)\n`;
                }

                if (customText) {
                    message += `\nملاحظة إضافية: ${customText}\n`;
                }

                return message;

            const openWhatsApp = (device, customText = '', includeRib = settings.includeRibInWhatsApp) => {
                let phone = device.phone.replace(/[^0-9]/g, '');
                if (phone.startsWith('0')) {
                    phone = '212' + phone.substring(1);
                }
                const text = buildWhatsAppMessage(device, customText, includeRib);
                const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');

            // If user is not authenticated, display the Role Selection & Authentication Portal
            if (!currentUser) {

                            opacity={settings.circuitOpacity !== undefined ? settings.circuitOpacity : 75}
                            pulse={settings.circuitPulse !== false}

                        {/* Toast Notification */}
                        {toast && (

                                <i className="fa-solid fa-circle-check text-lg"></i>

                        <AuthPortal

                            }}
                            settings={settings}
                            setSettings={setSettings}
                            showToast={showToast}

                    </div>

            return (

        /* -------------------------------------------------------------
           INTAKE / EDIT MODAL COMPONENT (Upgraded with Brands, Multi-Faults & Parts Supplier)
           ------------------------------------------------------------- */
        function IntakeModal({ device, nextId, settings, role, currentUser, availableTechnicians = [], onClose, onSave }) {
            const isEdit = !!device;

            // 1. Auto-fill assigned technician from logged-in account
            const defaultTech = useMemo(() => {
                if (device?.technician) return device.technician;
                if (currentUser?.fullName) return currentUser.fullName;
                if (availableTechnicians && availableTechnicians.length > 0) return availableTechnicians[0];
                return settings?.technicians?.[0] || 'يوسف السالمي';
            }, [device, currentUser, availableTechnicians, settings]);

            const [customerName, setCustomerName] = useState(device?.customerName || '');
            const [phone, setPhone] = useState(device?.phone || '');
            const [deviceModel, setDeviceModel] = useState(device?.deviceModel || '');
            const [passcode, setPasscode] = useState(device?.passcode || '');
            const [priority, setPriority] = useState(device?.priority || 'normal');
            const [technician, setTechnician] = useState(defaultTech);

            // Brand & Model Selector State
            const [selectedBrandId, setSelectedBrandId] = useState('apple');
            const [modelSearchQuery, setModelSearchQuery] = useState('');

            // Multi-Faults State
            const initialFaults = useMemo(() => {
                if (device?.selectedFaults && Array.isArray(device.selectedFaults) && device.selectedFaults.length > 0) {
                    return device.selectedFaults;
                }
                if (device?.tags && Array.isArray(device.tags) && device.tags.length > 0) {
                    return device.tags;
                }
                if (device?.issue && typeof device.issue === 'string') {
                    // Split on + or return as single item if not empty
                    return device.issue.split('+').map(s => s.trim()).filter(Boolean);
                }
                return [];
            }, [device]);

            const [selectedFaults, setSelectedFaults] = useState(initialFaults);
            const [faultCategory, setFaultCategory] = useState('الكل');
            const [faultFilterSearch, setFaultFilterSearch] = useState('');
            const [customFaultInput, setCustomFaultInput] = useState('');
            const [issueNotes, setIssueNotes] = useState(device?.issueNotes || '');

            // Spare Parts & Supplier Sourcing State
            const [partsUsed, setPartsUsed] = useState(device?.partsUsed || '');
            const [partSource, setPartSource] = useState(device?.partSource || 'in_stock'); // 'in_stock' | 'purchased_external'
            const [partSupplier, setPartSupplier] = useState(device?.partSupplier || '');
            const [partPurchasePrice, setPartPurchasePrice] = useState(device?.partPurchasePrice || device?.partsCost || '');
            const [partPaidToSupplier, setPartPaidToSupplier] = useState(device?.partPaidToSupplier !== undefined ? device.partPaidToSupplier : true);
            const [repairCost, setRepairCost] = useState(device?.repairCost || '');
            const [partsCost, setPartsCost] = useState(device?.partsCost || 0);

            // Toggle fault in/out of selectedFaults
            const toggleFault = (faultLabel) => {
                setSelectedFaults(prev => 
                    prev.includes(faultLabel) 
                        ? prev.filter(f => f !== faultLabel) 
                        : [...prev, faultLabel]
                );
            };

            const removeFault = (faultLabel) => {
                setSelectedFaults(prev => prev.filter(f => f !== faultLabel));
            };

            const handleAddCustomFault = () => {
                const trimmed = customFaultInput.trim();
                if (!trimmed) return;
                if (!selectedFaults.includes(trimmed)) {
                    setSelectedFaults(prev => [...prev, trimmed]);
                }
                setCustomFaultInput('');
            };

            const addQuickPart = (partName) => {
                setPartsUsed(prev => {
                    if (!prev) return partName;
                    if (prev.includes(partName)) return prev;
                    return `${prev} + ${partName}`;
                });
            };

            // Instant Model Search Filter across all brands
            const allModelsFlat = useMemo(() => {
                const list = [];
                BRANDS_DATABASE.forEach(b => {
                    b.categories.forEach(cat => {
                        cat.models.forEach(m => {
                            list.push({ brandId: b.id, brandName: b.name, model: m });
                        });
                    });
                });
                return list;
            }, []);

            const filteredSearchResults = useMemo(() => {
                if (!modelSearchQuery.trim()) return [];
                const q = modelSearchQuery.toLowerCase().trim();
                return allModelsFlat.filter(item => 
                    item.model.toLowerCase().includes(q) || 
                    item.brandName.toLowerCase().includes(q)
                );
            }, [modelSearchQuery, allModelsFlat]);

            const selectedBrand = useMemo(() => {
                return BRANDS_DATABASE.find(b => b.id === selectedBrandId) || BRANDS_DATABASE[0];
            }, [selectedBrandId]);

            // Filtered Faults
            const filteredFaultsList = useMemo(() => {
                let list = COMPREHENSIVE_FAULTS_LIST;
                if (faultCategory !== 'الكل') {
                    list = list.filter(f => f.category === faultCategory);
                }
                if (faultFilterSearch.trim()) {
                    const q = faultFilterSearch.toLowerCase().trim();
                    list = list.filter(f => f.label.toLowerCase().includes(q) || f.category.toLowerCase().includes(q));
                }
                return list;
            }, [faultCategory, faultFilterSearch]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!customerName || !deviceModel || !phone) return;

                const finalIssue = selectedFaults.length > 0 
                    ? selectedFaults.join(' + ') + (issueNotes.trim() ? ` [${issueNotes.trim()}]` : '')
                    : (issueNotes.trim() || 'فحص عام وإصلاح');

                const effectivePartsCost = partSource === 'purchased_external' 
                    ? (Number(partPurchasePrice) || 0) 
                    : (Number(partsCost) || 0);

                const ticketData = {
                    id: device ? device.id : nextId,
                    customerName: customerName.trim(),
                    phone: phone.trim(),
                    deviceModel: deviceModel.trim(),
                    issue: finalIssue,
                    selectedFaults,
                    issueNotes: issueNotes.trim(),
                    passcode: passcode || 'لا يوجد',
                    priority,
                    status: device ? device.status : 'new',
                    technician,
                    repairCost: Number(repairCost) || 0,
                    partsCost: effectivePartsCost,
                    partsUsed: partsUsed.trim(),
                    partSource,
                    partSupplier: partSource === 'purchased_external' ? partSupplier.trim() : '',
                    partPurchasePrice: partSource === 'purchased_external' ? (Number(partPurchasePrice) || 0) : 0,
                    partPaidToSupplier: partSource === 'purchased_external' ? partPaidToSupplier : true,
                    tags: selectedFaults.length > 0 ? selectedFaults : [],
                    isOverdue: device ? device.isOverdue : false,
                    createdAt: device ? device.createdAt : new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                onSave(ticketData);
            };

            const effectiveCostForCalc = partSource === 'purchased_external' 
                ? (Number(partPurchasePrice) || 0) 
                : (Number(partsCost) || 0);
            const calculatedProfit = (Number(repairCost) || 0) - effectiveCostForCalc;

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
                    <div className="bg-darkCard border border-darkBorder rounded-2xl max-w-3xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden my-auto">
                        {/* Header */}
                        <div className="p-4 md:p-5 border-b border-darkBorder flex items-center justify-between bg-darkCardSecondary/50">
                            <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-sm shadow">
                                    <i className="fa-solid fa-mobile-screen-button"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-black text-white">
                                        {isEdit ? `تعديل التذكرة #${device.id}` : `تسجيل واستلام جهاز جديد #${nextId}`}
                                    </h3>
                                    <p className="text-xs text-gray-400">تحديد الموديل بدقة، الأعطال المتعددة، ومصدر قطع الغيار</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white p-2 text-base">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Form Body */}
                        <form onSubmit={handleSubmit} className="p-3 sm:p-5 overflow-y-auto space-y-4 text-xs">
                            {/* Customer Info */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block font-bold text-gray-300 mb-1">اسم الزبون الكامل *</label>
                                    <input
                                        type="text"
                                        value={customerName}
                                        onChange={(e) => setCustomerName(e.target.value)}
                                        required
                                        placeholder="مثال: يوسف العلوي"
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-300 mb-1">رقم الهاتف (للاتصال والواتساب) *</label>
                                    <input
                                        type="text"
                                        value={phone}
                                        onChange={(e) => setPhone(e.target.value)}
                                        required
                                        placeholder="مثال: 0612345678"
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500 font-mono"
                                    />
                                </div>
                            </div>

                            {/* ================= SECTION 1: BRAND & MODEL SELECTOR ================= */}
                            <div className="bg-darkBg p-3.5 rounded-2xl border border-darkBorder space-y-3">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                    <label className="font-bold text-emerald-400 flex items-center gap-1.5 text-xs">
                                        <i className="fa-solid fa-mobile-screen"></i>
                                        <span>اختيار ماركة وموديل الهاتف / التابلت بدقة:</span>
                                    </label>

                                <button
                                    type="submit"
                                    className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black transition flex items-center gap-2 shadow-lg shadow-emerald-950">
                                    <i className="fa-solid fa-floppy-disk"></i>
                                    <span>{isEdit ? 'حفظ التعديلات' : 'تسجيل الجهاز وطباعة الوصل'}</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        /* -------------------------------------------------------------
           WHATSAPP MODAL COMPONENT (With RIB option & respectful message)
           ------------------------------------------------------------- */
        function WhatsAppModal({ device, settings, onClose, onSend }) {
            const [includeRib, setIncludeRib] = useState(settings.includeRibInWhatsApp);
            const [customNote, setCustomNote] = useState('');

            // Generate message preview
            const preview = useMemo(() => {
                const custName = device.customerName;
                const model = device.deviceModel;
                const ticketId = device.id;
                const cost = device.repairCost || 0;
                const rib = settings.rib;
                const workshop = settings.workshopName;

                let msg = `السلام عليكم أخي الكريم ${custName}،\n`;
                if (device.status === 'ready') {
                    msg += `نخبركم من ورشة *${workshop}* أن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) قد تم إصلاحه بنجاح وهو *جاهز للاستلام* الآن ✅.\n\n`;
                    msg += `💰 المبلغ المطلوب: *${cost} ${settings.currency}*\n`;
                } else if (device.status === 'in_progress') {
                    msg += `نحيطكم علماً بأن جهازكم *${model}* (تذكرة: *#${ticketId}*) هو حالياً *قيد الفحص والإصلاح الدقيق* لدى ورشة *${workshop}* 🛠️.\n`;
                } else if (device.status === 'waiting_parts') {
                    msg += `بخصوص جهازكم *${model}* (تذكرة: *#${ticketId}*) لدى ورشة *${workshop}*:\nنحن بانتظار استلام قطعة الغيار الأصلية المطلوبة ⏳.\n`;
                } else {
                    msg += `معك ورشة *${workshop}* بخصوص جهازك *${model}* (تذكرة: *#${ticketId}*).\n`;
                }

                if (includeRib && rib) {
                    msg += `\n💳 *للدفع المباشر عبر التحويل البنكي (RIB):*\n${rib}\n(يرجى إرسال وصل التحويل عند إتمامه)\n`;
                }

                if (customNote) {
                    msg += `\nملاحظة: ${customNote}\n`;
                }

                msg += `\n📍 مرحباً بكم في الورشة، وشكراً لثقتكم بنا.`;
                return msg;
            }, [device, settings, includeRib, customNote]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(preview);
                alert('تم نسخ نص الرسالة إلى الحافظة!');
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-darkCard border border-darkBorder rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl">
                        <div className="flex items-center justify-between border-b border-darkBorder pb-3">
                            <div className="flex items-center gap-2 text-emerald-400">
                                <i className="fa-brands fa-whatsapp text-2xl"></i>
                                <h3 className="font-extrabold text-white text-base">إرسال إشعار واتساب للزبون</h3>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Customer overview */}
                        <div className="bg-darkBg p-3 rounded-xl border border-darkBorder flex items-center justify-between text-xs">
                            <div>
                                <span className="font-bold text-white block">{device.customerName}</span>
                                <span className="text-gray-400 font-mono">{device.phone}</span>
                            </div>
                            <div className="text-left">
                                <span className="font-mono text-emerald-400 font-bold block">{device.deviceModel}</span>
                                <span className="text-[10px] text-gray-500">#{device.id}</span>
                            </div>
                        </div>

                        {/* RIB Option Checkbox */}
                        <div className="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl space-y-1">
                            <label className="flex items-center gap-2 text-xs font-bold text-emerald-300 cursor-pointer">
                                <input
                                    type="checkbox"
                                    checked={includeRib}
                                    onChange={(e) => setIncludeRib(e.target.checked)}
                                    className="rounded bg-darkBg border-darkBorder text-emerald-500 w-4 h-4 cursor-pointer"
                                />
                                <span>تضمين رقم الحساب البنكي (RIB) في الرسالة لدفع ثمن الإصلاح</span>
                            </label>
                            {includeRib && (
                                <p className="text-[11px] text-gray-400 font-mono pr-6">
                                    الحساب: {settings.rib || 'يرجى إدخال الـ RIB في الإعدادات'}
                                </p>
                            )}
                        </div>

                        {/* Custom note */}
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1">ملاحظة إضافية مخصصة (اختياري):</label>
                            <input
                                type="text"
                                value={customNote}
                                onChange={(e) => setCustomNote(e.target.value)}
                                placeholder="مثلاً: يرجى إحضار كابل الشحن معكم..."
                                className="w-full bg-darkBg border border-darkBorder rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                            />
                        </div>

                        {/* Preview Box */}
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1">معاينة الرسالة:</label>
                            <div className="bg-darkBg/90 border border-darkBorder rounded-xl p-3 text-xs text-gray-300 whitespace-pre-line font-sans max-h-48 overflow-y-auto leading-relaxed border-r-2 border-r-emerald-500">
                                {preview}
                            </div>
                        </div>

                        {/* Buttons */}
                        <div className="flex items-center justify-between pt-2 gap-2">
                            <button
                                onClick={copyToClipboard}
                                className="px-3.5 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold transition flex items-center gap-1.5">
                                <i className="fa-solid fa-copy"></i>
                                <span>نسخ النص</span>
                            </button>

                            <button
                                onClick={() => onSend(customNote, includeRib)}
                                className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black transition flex items-center gap-2 shadow-lg shadow-emerald-950">
                                <i className="fa-brands fa-whatsapp text-sm"></i>
                                <span>إرسال عبر واتساب الآن</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        /* -------------------------------------------------------------
           RECEIPT MODAL COMPONENT (Official printable ticket slip)
           ------------------------------------------------------------- */
        function ReceiptModal({ device, settings, onClose }) {
            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white text-gray-900 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative my-auto">
                        <div className="no-print flex items-center justify-between border-b pb-3">
                            <span className="text-xs font-bold text-gray-500">معاينة وصل استلام الجهاز</span>
                            <div className="flex items-center gap-2">
                                <button onClick={handlePrint} className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold flex items-center gap-1.5">
                                    <i className="fa-solid fa-print"></i>
                                    <span>طباعة الوصل</span>
                                </button>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-900 p-1">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        {/* Printable Ticket */}
                        <div className="p-2 space-y-4 text-right" dir="rtl">
                            {/* Workshop Header */}
                            <div className="text-center border-b pb-3 space-y-1">
                                <h2 className="text-xl font-black text-gray-900">{settings.workshopName}</h2>
                                <p className="text-xs text-gray-600">{settings.address}</p>
                                <p className="text-xs text-gray-600 font-mono">الهاتف: {settings.phone}</p>
                                <div className="mt-2 inline-block px-3 py-1 bg-gray-100 rounded-full font-mono font-black text-sm">
                                    تذكرة رقم: #{device.id}
                                </div>
                            </div>

                            {/* Details */}
                            <div className="space-y-2 text-xs">
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">الزبون:</span>
                                    <span className="font-bold">{device.customerName}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">الهاتف:</span>
                                    <span className="font-mono">{device.phone}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">نوع الجهاز:</span>
                                    <span className="font-bold">{device.deviceModel}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">العطل المصرح به:</span>
                                    <span className="font-medium text-gray-800">{device.issue}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">رمز القفل:</span>
                                    <span className="font-mono font-bold">{device.passcode}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">تاريخ الاستلام:</span>
                                    <span className="font-mono">{new Date(device.createdAt).toLocaleDateString('ar-MA')}</span>
                                </div>
                            </div>

                            {/* Financial */}
                            <div className="bg-gray-50 p-3 rounded-xl border flex justify-between items-center">
                                <span className="font-bold text-xs text-gray-700">المبلغ المتفق عليه للإصلاح:</span>
                                <span className="text-base font-black text-emerald-700 font-mono">
                                    {device.repairCost} {settings.currency}
                                </span>
                            </div>

                            {/* Bank RIB on receipt if available */}
                            {settings.rib && (
                                <div className="p-2 rounded bg-gray-50 border text-[10px] space-y-0.5">
                                    <span className="font-bold text-gray-700 block">للدفع عبر التحويل البنكي (RIB):</span>
                                    <span className="font-mono text-gray-900 block font-bold">{settings.rib}</span>
                                </div>
                            )}

                            {/* Terms */}
                            <div className="text-[9px] text-gray-500 space-y-1 pt-1 border-t">
                                <p>• يرجى الإدلاء بهذا الوصل عند استلام الجهاز.</p>
                                <p>• الورشة غير مسؤولة عن الأجهزة التي تتجاوز مدة بقائها 30 يوماً بعد الإشعار بالجاهزية.</p>
                                <p>• ضمان الإصلاح يشمل العطل المحدد فقط لمدة شهر من تاريخ التسليم.</p>
                            </div>

                            <div className="pt-3 text-center text-xs font-bold text-gray-800">
                                شكراً لثقتكم بنا!
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
