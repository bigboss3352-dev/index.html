                        {pulse && (

                                    <animateMotion 
                                        path="M 0,280 L 90,280 L 130,320 L 170,320 L 210,360 L 210,480 L 180,510 L 0,510"

        function App() {
            // Role: 'manager' | 'worker'
            const [role, setRole] = useState(() => localStorage.getItem('circuitfix_role') || 'manager');

            // Active Tab: 'dashboard' | 'tickets' | 'customers' | 'inventory' | 'settings'
            const [activeTab, setActiveTab] = useState('dashboard');

            // Workshop Settings
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('circuitfix_settings');
                if (saved) {
                    try { return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) }; } catch(e) { console.error(e); }
                }
                return DEFAULT_SETTINGS;
            });

            // Devices list
            const [devices, setDevices] = useState(() => {
                const saved = localStorage.getItem('circuitfix_devices');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return INITIAL_DEVICES;
            });

            // Inventory state
            const [inventory, setInventory] = useState(() => {
                const saved = localStorage.getItem('circuitfix_inventory');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                return INITIAL_INVENTORY;
            });

            // Search & Filter
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');

            // Modals
            const [showNewIntakeModal, setShowNewIntakeModal] = useState(false);
            const [editingDevice, setEditingDevice] = useState(null);
            const [whatsAppModalDevice, setWhatsAppModalDevice] = useState(null);
            const [receiptModalDevice, setReceiptModalDevice] = useState(null);
            const [deviceToDelete, setDeviceToDelete] = useState(null);

            // Passcode visibility tracker by device ID
            const [revealedPasscodes, setRevealedPasscodes] = useState({});

            // Notification toast
            const [toast, setToast] = useState(null);

            // Save to localStorage
            useEffect(() => {
                localStorage.setItem('circuitfix_role', role);
            }, [role]);

            useEffect(() => {
                localStorage.setItem('circuitfix_settings', JSON.stringify(settings));
            }, [settings]);

            useEffect(() => {
                localStorage.setItem('circuitfix_devices', JSON.stringify(devices));
            }, [devices]);

            useEffect(() => {
                localStorage.setItem('circuitfix_inventory', JSON.stringify(inventory));
            }, [inventory]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const togglePasscode = (id) => {
                setRevealedPasscodes(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            // Switch status of ticket
            const handleUpdateStatus = (deviceId, newStatus) => {
                setDevices(prev => prev.map(d => {
                    if (d.id === deviceId) {
                        return { ...d, status: newStatus, updatedAt: new Date().toISOString() };
                    }
                    return d;
                }));
                showToast(`تم تحديث تذكرة ${deviceId} إلى "${STATUS_CONFIG[newStatus].label}"`);
            };

            // Delete ticket
            const handleDeleteDevice = () => {
                if (!deviceToDelete) return;
                setDevices(prev => prev.filter(d => d.id !== deviceToDelete.id));
                showToast(`تم حذف التذكرة ${deviceToDelete.id}`);
                setDeviceToDelete(null);
            };

            // Next Ticket ID generator
            const getNextTicketId = () => {
                const year = new Date().getFullYear();
                const nums = devices
                    .map(d => {
                        const match = d.id.match(/REP-\d+-(\d+)/);
                        return match ? parseInt(match[1], 10) : 0;
                    })
                    .filter(n => !isNaN(n));
                const nextNum = nums.length > 0 ? Math.max(...nums) + 1 : 105;
                return `REP-${year}-${nextNum}`;
            };

            // Filtered Devices
            const filteredDevices = useMemo(() => {
                return devices.filter(d => {
                    const q = searchQuery.trim().toLowerCase();
                    const matchesQuery = !q || (
                        d.id.toLowerCase().includes(q) ||
                        d.customerName.toLowerCase().includes(q) ||
                        d.phone.includes(q) ||
                        d.deviceModel.toLowerCase().includes(q) ||
                        d.issue.toLowerCase().includes(q) ||
                        (d.technician && d.technician.toLowerCase().includes(q))
                    );
                    const matchesStatus = statusFilter === 'all' || d.status === statusFilter;
                    return matchesQuery && matchesStatus;
                });
            }, [devices, searchQuery, statusFilter]);

            // Financial & KPI Computations
            const stats = useMemo(() => {
                const total = devices.length;
                const inProgress = devices.filter(d => d.status === 'in_progress').length;
                const waitingParts = devices.filter(d => d.status === 'waiting_parts').length;
                const ready = devices.filter(d => d.status === 'ready').length;
                const delivered = devices.filter(d => d.status === 'delivered').length;
                const urgent = devices.filter(d => d.priority === 'urgent' && d.status !== 'delivered').length;

                // Total revenues
                const totalRevenue = devices.reduce((sum, d) => sum + (Number(d.repairCost) || 0), 0);
                const totalPartsCost = devices.reduce((sum, d) => sum + (Number(d.partsCost) || 0), 0);
                const netProfit = totalRevenue - totalPartsCost;

                // Stock alerts
                const lowStockCount = inventory.filter(item => item.quantity <= item.minAlert).length;

                return {
                    total,
                    inProgress,
                    waitingParts,
                    ready,
                    delivered,
                    urgent,
                    totalRevenue,
                    totalPartsCost,
                    netProfit,
                    lowStockCount
                };
            }, [devices, inventory]);

            // WhatsApp link generator with RIB and professional formatting
            const buildWhatsAppMessage = (device, customText = '', includeRib = settings.includeRibInWhatsApp) => {
                const custName = device.customerName;
                const model = device.deviceModel;
                const ticketId = device.id;
                const cost = device.repairCost || 0;
                const rib = settings.rib;
                const workshop = settings.workshopName;

                let message = `السلام عليكم أخي الكريم ${custName}،\n`;
                
                if (device.status === 'ready') {
                    message += `نخبركم من ورشة *${workshop}* أن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) قد تم إصلاحه بنجاح وهو *جاهز للاستلام* الآن ✅.\n\n`;
                    message += `💰 المبلغ المطلوب للإصلاح: *${cost} ${settings.currency}*\n`;
                } else if (device.status === 'in_progress') {
                    message += `نحيطكم علماً بأن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) هو حالياً *قيد الفحص والإصلاح* في ورشة *${workshop}* 🛠️.\n`;
                    message += `سنوافيكم بإشعار فوري عند اكتماله.\n`;
                } else if (device.status === 'waiting_parts') {
                    message += `بخصوص جهازكم *${model}* (تذكرة: *#${ticketId}*) لدى ورشة *${workshop}*:\n`;
                    message += `نحن بانتظار استلام قطعة الغيار الأصلية المطلوبة لضمان أعلى جودة ⏳.\n`;
                } else {
                    message += `معك ورشة *${workshop}* بخصوص جهازك *${model}* (تذكرة: *#${ticketId}*).\n`;
                }

                // Add RIB if enabled
                if (includeRib && rib) {
                    message += `\n💳 *للدفع المباشر عبر التحويل البنكي (RIB):*\n\`${rib}\`\n(يرجى إرسال وصل التحويل عند إتمامه)\n`;
                }

                if (customText) {
                    message += `\nملاحظة إضافية: ${customText}\n`;
                }

                message += `\n📍 مرحباً بكم في الورشة، وشكراً جزيلاً لثقتكم بنا.`;

                return message;
            };

            const openWhatsApp = (device, customText = '', includeRib = settings.includeRibInWhatsApp) => {
                let phone = device.phone.replace(/[^0-9]/g, '');
                if (phone.startsWith('0')) {
                    phone = '212' + phone.substring(1);
                }
                const text = buildWhatsAppMessage(device, customText, includeRib);
                const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="flex h-screen overflow-hidden bg-darkBg text-gray-200 relative">
                    {/* Electronic PCB Circuit Board Schematic Background */}
                    <CircuitBackground 
                        theme={settings.circuitTheme || 'emerald'}
                        opacity={settings.circuitOpacity !== undefined ? settings.circuitOpacity : 75}
                        pulse={settings.circuitPulse !== false}
                    />

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl font-bold flex items-center gap-3 border border-emerald-400 animate-fade-in text-sm">
                            <i className="fa-solid fa-circle-check text-lg"></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* DESKTOP SIDEBAR */}
                    <aside className="w-64 bg-darkCard border-l border-darkBorder flex-col justify-between hidden md:flex flex-shrink-0 z-20">
                        <div>
                            {/* Brand Header */}
                            <div className="p-5 border-b border-darkBorder flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white shadow-lg shadow-emerald-900/40">
                                        <i className="fa-solid fa-microchip text-lg"></i>
                                    </div>
                                    <div className="overflow-hidden">
                                        <h1 className="font-extrabold text-base text-white tracking-wide flex items-center gap-1.5 truncate">
                                            {settings.workshopName || 'CircuitFix'}
                                        </h1>
                                        <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">PRO WORKSHOP</span>
                                    </div>
                                </div>
                            </div>

                            {/* Role Switcher */}

                                <label className="text-[11px] font-semibold text-gray-400 mb-1.5 block">وضع التحكم الحالي:</label>
                                <div className="grid grid-cols-2 gap-1 p-1 bg-darkBg rounded-xl border border-darkBorder text-xs font-bold">
                                    <button

                                    <div className="flex items-center gap-3">

                                </button>

                                <button

                                        <span>تذاكر الإصلاح</span>

                                            {stats.urgent} عاجل

                                    </div>

                                <button

                                    className={`w-full text-right px-4 py-3 rounded-xl font-medium transition flex items-center justify-between text-sm ${activeTab === 'inventory' ? 'bg-emerald-600/15 text-emerald-400 border border-emerald-500/30 font-bold' : 'text-gray-400 hover:text-white hover:bg-gray-800/60'}`}>
                                    <div className="flex items-center gap-3">

                                    {stats.lowStockCount > 0 && (

                                            {stats.lowStockCount} ناقص
                                        </span>
                                    )}
                                </button>

                                <button
                                    id="nav-settings-btn"
                                    onClick={() => setActiveTab('settings')}
                                    className={`w-full text-right px-4 py-3 rounded-xl font-medium transition flex items-center justify-between text-sm ${activeTab === 'settings' ? 'bg-emerald-600/15 text-emerald-400 border border-emerald-500/30 font-bold' : 'text-gray-400 hover:text-white hover:bg-gray-800/60'}`}>
                                    <div className="flex items-center gap-3">
                                        <i className="fa-solid fa-gear w-5 text-center"></i>
                                        <span>إعدادات الورشة والـ RIB</span>
                                    </div>
                                </button>
                            </nav>
                        </div>

                        {/* Sidebar Footer info */}
                        <div className="p-4 border-t border-darkBorder">

                                <div className="flex justify-between items-center text-gray-300 font-semibold">
                                    <span>الحساب البنكي (RIB):</span>
                                    <span className="text-emerald-400 text-[10px] font-mono">مفعل</span>
                                </div>
                                <p className="text-[10px] text-gray-500 truncate font-mono" title={settings.rib}>
                                    {settings.rib || 'لم يتم تعيين RIB'}
                                </p>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTAINER */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden">

                            {/* Right Actions */}

                                {/* Role Badge */}
                                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-darkBg border border-darkBorder text-xs">

                <div 
                    id={`ticket-${device.id}`}

                            </div>

                    </div>

                    {/* Right / Actions & Status changing sidebar */}
                    <div className="bg-darkCardSecondary/40 p-4 border-t lg:border-t-0 lg:border-r border-darkBorder flex flex-col justify-between min-w-[240px] space-y-3">
                        {/* Current Status Badge */}
                        <div className="flex items-center justify-between">
                            <span className="text-[10px] text-gray-400 font-mono">الحالة الحالية:</span>
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border flex items-center gap-1.5 ${statusConf.color}`}>
                                <i className={`fa-solid ${statusConf.icon} text-[10px]`}></i>
                                <span>{statusConf.label}</span>
                            </span>
                        </div>

                        {/* Quick action button depending on status */}
                        <div className="space-y-1.5">
                            {device.status === 'new' && (
                                <button

                                    <i className="fa-solid fa-screwdriver-wrench"></i>
                                    <span>بدء الفحص والإصلاح ⬅️</span>
                                </button>
                            )}

                            {device.status === 'in_progress' && (
                                <button
                                    onClick={() => onUpdateStatus('ready')}

                                    <i className="fa-solid fa-circle-check"></i>
                                    <span>تحديد كجاهز للاستلام ⬅️</span>
                                </button>
                            )}

                            {device.status === 'waiting_parts' && (
                                <button
                                    onClick={() => onUpdateStatus('in_progress')}
                                    className="w-full py-2 px-3 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i className="fa-solid fa-box-open"></i>
                                    <span>وصلت القطع - استئناف الإصلاح</span>
                                </button>
                            )}

                            {device.status === 'ready' && (
                                <button
                                    onClick={() => onUpdateStatus('delivered')}
                                    className="w-full py-2 px-3 bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                                    <i className="fa-solid fa-box-archive"></i>
                                    <span>تسليم للزبون وقبض المبلغ ⬅️</span>
                                </button>
                            )}

                            {/* Status Changer dropdown */}
                            <select
                                value={device.status}
                                onChange={(e) => onUpdateStatus(e.target.value)}
                                className="w-full bg-darkBg border border-darkBorder rounded-xl px-2.5 py-1.5 text-xs text-gray-300 focus:outline-none focus:border-emerald-500 cursor-pointer">
                                {Object.entries(STATUS_CONFIG).map(([k, c]) => (
                                    <option key={k} value={k}>تحويل إلى: {c.label}</option>
                                ))}

                        {/* Communication & Print Action Buttons */}
                        <div className="grid grid-cols-4 gap-1.5 pt-1">
                            {/* WhatsApp button */}
                            <button
                                onClick={onOpenWhatsApp}
                                title="إرسال واتساب مع تفاصيل الحساب البنكي"
                                className="py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/30 flex items-center justify-center transition text-xs font-bold">

                            </button>

                            {/* Direct phone call */}
                            <a
                                href={`tel:${device.phone}`}

                                <i className="fa-solid fa-phone text-xs"></i>

                            <button

                            <button

        /* -------------------------------------------------------------
           INTAKE / EDIT MODAL COMPONENT
           ------------------------------------------------------------- */
        function IntakeModal({ device, nextId, settings, onClose, onSave }) {
            const isEdit = !!device;

            const [customerName, setCustomerName] = useState(device?.customerName || '');
            const [phone, setPhone] = useState(device?.phone || '');
            const [deviceModel, setDeviceModel] = useState(device?.deviceModel || '');
            const [issue, setIssue] = useState(device?.issue || '');
            const [passcode, setPasscode] = useState(device?.passcode || '');
            const [priority, setPriority] = useState(device?.priority || 'normal');
            const [technician, setTechnician] = useState(device?.technician || settings.technicians[0] || 'يوسف السالمي');
            const [repairCost, setRepairCost] = useState(device?.repairCost || '');
            const [partsCost, setPartsCost] = useState(device?.partsCost || 0);
            const [partsUsed, setPartsUsed] = useState(device?.partsUsed || '');
            const [tags, setTags] = useState(device?.tags || []);

            const toggleTag = (tag) => {
                setTags(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]);
            };

            const addQuickPart = (partName) => {
                setPartsUsed(prev => {
                    if (!prev) return partName;
                    if (prev.includes(partName)) return prev;
                    return `${prev} + ${partName}`;
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!customerName || !deviceModel || !phone) return;

                const ticketData = {
                    id: device ? device.id : nextId,
                    customerName,
                    phone,
                    deviceModel,
                    issue,
                    passcode: passcode || 'لا يوجد',
                    priority,
                    status: device ? device.status : 'new',
                    technician,
                    repairCost: Number(repairCost) || 0,
                    partsCost: Number(partsCost) || 0,
                    partsUsed,
                    tags,
                    isOverdue: device ? device.isOverdue : false,
                    createdAt: device ? device.createdAt : new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                onSave(ticketData);
            };

            const calculatedProfit = (Number(repairCost) || 0) - (Number(partsCost) || 0);

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 md:p-4 overflow-y-auto">
                    <div className="bg-darkCard border border-darkBorder rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden my-auto">
                        {/* Header */}
                        <div className="p-4 md:p-5 border-b border-darkBorder flex items-center justify-between bg-darkCardSecondary/50">
                            <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-sm shadow">
                                    <i className="fa-solid fa-mobile-screen-button"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-black text-white">
                                        {isEdit ? `تعديل التذكرة #${device.id}` : `تسجيل واستلام جهاز جديد #${nextId}`}
                                    </h3>
                                    <p className="text-xs text-gray-400">سجل بيانات الزبون، العطل، رمز القفل، وقطع الغيار</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white p-2 text-base">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Form Body */}
                        <form onSubmit={handleSubmit} className="p-4 md:p-6 overflow-y-auto space-y-4 text-xs">
                            {/* Customer Info */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block font-bold text-gray-300 mb-1">اسم الزبون الكامل *</label>
                                    <input
                                        type="text"
                                        value={customerName}
                                        onChange={(e) => setCustomerName(e.target.value)}
                                        required
                                        placeholder="مثال: يوسف العلوي"
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-300 mb-1">رقم الهاتف (للاتصال والواتساب) *</label>
                                    <input
                                        type="text"
                                        value={phone}
                                        onChange={(e) => setPhone(e.target.value)}
                                        required
                                        placeholder="مثال: 0612345678"
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500 font-mono"
                                    />
                                </div>
                            </div>

                            {/* Device & Passcode */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div className="sm:col-span-2">
                                    <label className="block font-bold text-gray-300 mb-1">نوع وموديل الجهاز بدقة *</label>
                                    <input
                                        type="text"
                                        value={deviceModel}
                                        onChange={(e) => setDeviceModel(e.target.value)}
                                        required
                                        placeholder="مثال: Apple iPhone 15 Pro Max أو Samsung S24"
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500 font-bold"
                                    />
                                </div>
                                <div>
                                    <label className="block font-bold text-amber-300 mb-1">رمز القفل / الشاشة (Passcode)</label>
                                    <input
                                        type="text"
                                        value={passcode}
                                        onChange={(e) => setPasscode(e.target.value)}
                                        placeholder="مثال: 1234"
                                        className="w-full bg-darkBg border border-amber-500/40 rounded-xl px-3.5 py-2.5 text-amber-300 font-mono focus:outline-none focus:border-amber-400"
                                    />
                                </div>
                            </div>

                            {/* Issue description */}
                            <div>
                                <label className="block font-bold text-gray-300 mb-1">وصف العطل بدقة *</label>
                                <textarea
                                    value={issue}
                                    onChange={(e) => setIssue(e.target.value)}
                                    rows="2"
                                    required
                                    placeholder="مثلاً: كسر في الشاشة، لا يشحن، دخول ماء، الجهاز فاصل باور..."
                                    className="w-full bg-darkBg border border-darkBorder rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"></textarea>
                            </div>

                            {/* Quick Issue Tags Selection */}
                            <div>
                                <label className="block font-bold text-gray-400 mb-1.5">وسوم وتصنيف العطل (انقر للاختيار السريع):</label>
                                <div className="flex flex-wrap gap-1.5">
                                    {COMMON_ISSUE_TAGS.map((tag) => {
                                        const isSelected = tags.includes(tag);
                                        return (
                                            <button
                                                type="button"
                                                key={tag}
                                                onClick={() => toggleTag(tag)}
                                                className={`px-2.5 py-1 rounded-lg text-[11px] font-medium transition ${isSelected ? 'bg-purple-600 text-white font-bold' : 'bg-darkBg text-gray-400 border border-darkBorder hover:text-white'}`}>
                                                {tag}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Technician & Priority */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block font-bold text-gray-300 mb-1">التقني المكلف بالإصلاح</label>
                                    <select
                                        value={technician}
                                        onChange={(e) => setTechnician(e.target.value)}
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                                        {settings.technicians.map(t => (
                                            <option key={t} value={t}>{t}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-bold text-gray-300 mb-1">مستوى الأولوية</label>
                                    <select
                                        value={priority}
                                        onChange={(e) => setPriority(e.target.value)}
                                        className="w-full bg-darkBg border border-darkBorder rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                                        <option value="normal">أولوية عادية (Normal)</option>
                                        <option value="high">أولوية عالية (High)</option>
                                        <option value="urgent">عاجل جداً / طارئ (Urgent)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Spare Parts (الريب) Section */}
                            <div className="bg-darkBg p-4 rounded-2xl border border-darkBorder space-y-3">
                                <div className="flex items-center justify-between">
                                    <label className="font-bold text-purple-300 flex items-center gap-1.5">
                                        <i className="fa-solid fa-microchip"></i>
                                        <span>قطع الغيار المستعملة (الريب):</span>
                                    </label>
                                    <span className="text-[10px] text-gray-400">اكتب بحرية أو انقر الكبسولات</span>
                                </div>

                                <input
                                    type="text"
                                    value={partsUsed}
                                    onChange={(e) => setPartsUsed(e.target.value)}
                                    placeholder="مثال: شاشة OLED أصلية + كونكتور شحن..."
                                    className="w-full bg-darkCard border border-darkBorder rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-purple-500"
                                />

                                {/* Quick pills */}
                                <div className="flex flex-wrap gap-1">
                                    {QUICK_PARTS.map(p => (
                                        <button
                                            type="button"
                                            key={p}
                                            onClick={() => addQuickPart(p)}
                                            className="px-2 py-0.5 rounded bg-gray-800 hover:bg-purple-600 text-gray-300 hover:text-white text-[10px] transition border border-gray-700">
                                            + {p}
                                        </button>
                                    ))}
                                </div>

                                {/* Financial row */}
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2 border-t border-darkBorder">
                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-400 mb-1">ثمن الإصلاح للزبون ({settings.currency}) *</label>
                                        <input
                                            type="number"
                                            value={repairCost}
                                            onChange={(e) => setRepairCost(e.target.value)}
                                            required
                                            placeholder="مثال: 800"
                                            className="w-full bg-darkCard border border-darkBorder rounded-xl px-3 py-2 text-emerald-400 font-bold font-mono focus:outline-none focus:border-emerald-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-400 mb-1">تكلفة القطعة بالمحل ({settings.currency})</label>
                                        <input
                                            type="number"
                                            value={partsCost}
                                            onChange={(e) => setPartsCost(e.target.value)}
                                            placeholder="0 إذا كانت خردة/مجانية"
                                            className="w-full bg-darkCard border border-darkBorder rounded-xl px-3 py-2 text-purple-400 font-bold font-mono focus:outline-none focus:border-purple-500"
                                        />
                                    </div>
                                    <div className="col-span-2 sm:col-span-1 bg-darkCard p-2 rounded-xl border border-darkBorder flex flex-col justify-center text-center">
                                        <span className="text-[10px] text-gray-400">صافي ربح اليد العاملة</span>
                                        <span className="text-base font-black text-emerald-400 font-mono">
                                            {calculatedProfit} {settings.currency}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Submit buttons */}
                            <div className="pt-2 flex items-center justify-end gap-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="px-4 py-2.5 rounded-xl bg-gray-800 text-gray-300 font-bold hover:bg-gray-700 transition">
                                    إلغاء
                                </button>
                                <button
                                    type="submit"
                                    className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black transition flex items-center gap-2 shadow-lg shadow-emerald-950">
                                    <i className="fa-solid fa-floppy-disk"></i>
                                    <span>{isEdit ? 'حفظ التعديلات' : 'تسجيل الجهاز وطباعة الوصل'}</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        /* -------------------------------------------------------------
           WHATSAPP MODAL COMPONENT (With RIB option & respectful message)
           ------------------------------------------------------------- */
        function WhatsAppModal({ device, settings, onClose, onSend }) {
            const [includeRib, setIncludeRib] = useState(settings.includeRibInWhatsApp);
            const [customNote, setCustomNote] = useState('');

            // Generate message preview
            const preview = useMemo(() => {
                const custName = device.customerName;
                const model = device.deviceModel;
                const ticketId = device.id;
                const cost = device.repairCost || 0;
                const rib = settings.rib;
                const workshop = settings.workshopName;

                let msg = `السلام عليكم أخي الكريم ${custName}،\n`;
                if (device.status === 'ready') {
                    msg += `نخبركم من ورشة *${workshop}* أن جهازكم *${model}* (تذكرة رقم: *#${ticketId}*) قد تم إصلاحه بنجاح وهو *جاهز للاستلام* الآن ✅.\n\n`;
                    msg += `💰 المبلغ المطلوب: *${cost} ${settings.currency}*\n`;
                } else if (device.status === 'in_progress') {
                    msg += `نحيطكم علماً بأن جهازكم *${model}* (تذكرة: *#${ticketId}*) هو حالياً *قيد الفحص والإصلاح الدقيق* لدى ورشة *${workshop}* 🛠️.\n`;
                } else if (device.status === 'waiting_parts') {
                    msg += `بخصوص جهازكم *${model}* (تذكرة: *#${ticketId}*) لدى ورشة *${workshop}*:\nنحن بانتظار استلام قطعة الغيار الأصلية المطلوبة ⏳.\n`;
                } else {
                    msg += `معك ورشة *${workshop}* بخصوص جهازك *${model}* (تذكرة: *#${ticketId}*).\n`;
                }

                if (includeRib && rib) {
                    msg += `\n💳 *للدفع المباشر عبر التحويل البنكي (RIB):*\n${rib}\n(يرجى إرسال وصل التحويل عند إتمامه)\n`;
                }

                if (customNote) {
                    msg += `\nملاحظة: ${customNote}\n`;
                }

                msg += `\n📍 مرحباً بكم في الورشة، وشكراً لثقتكم بنا.`;
                return msg;
            }, [device, settings, includeRib, customNote]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(preview);
                alert('تم نسخ نص الرسالة إلى الحافظة!');
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-darkCard border border-darkBorder rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl">
                        <div className="flex items-center justify-between border-b border-darkBorder pb-3">
                            <div className="flex items-center gap-2 text-emerald-400">
                                <i className="fa-brands fa-whatsapp text-2xl"></i>
                                <h3 className="font-extrabold text-white text-base">إرسال إشعار واتساب للزبون</h3>
                            </div>
                            <button onClick={onClose} className="text-gray-400 hover:text-white">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Customer overview */}
                        <div className="bg-darkBg p-3 rounded-xl border border-darkBorder flex items-center justify-between text-xs">
                            <div>
                                <span className="font-bold text-white block">{device.customerName}</span>
                                <span className="text-gray-400 font-mono">{device.phone}</span>
                            </div>
                            <div className="text-left">
                                <span className="font-mono text-emerald-400 font-bold block">{device.deviceModel}</span>
                                <span className="text-[10px] text-gray-500">#{device.id}</span>
                            </div>
                        </div>

                        {/* RIB Option Checkbox */}
                        <div className="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl space-y-1">
                            <label className="flex items-center gap-2 text-xs font-bold text-emerald-300 cursor-pointer">
                                <input
                                    type="checkbox"
                                    checked={includeRib}
                                    onChange={(e) => setIncludeRib(e.target.checked)}
                                    className="rounded bg-darkBg border-darkBorder text-emerald-500 w-4 h-4 cursor-pointer"
                                />
                                <span>تضمين رقم الحساب البنكي (RIB) في الرسالة لدفع ثمن الإصلاح</span>
                            </label>
                            {includeRib && (
                                <p className="text-[11px] text-gray-400 font-mono pr-6">
                                    الحساب: {settings.rib || 'يرجى إدخال الـ RIB في الإعدادات'}
                                </p>
                            )}
                        </div>

                        {/* Custom note */}
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1">ملاحظة إضافية مخصصة (اختياري):</label>
                            <input
                                type="text"
                                value={customNote}
                                onChange={(e) => setCustomNote(e.target.value)}
                                placeholder="مثلاً: يرجى إحضار كابل الشحن معكم..."
                                className="w-full bg-darkBg border border-darkBorder rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                            />
                        </div>

                        {/* Preview Box */}
                        <div>
                            <label className="block text-xs font-bold text-gray-400 mb-1">معاينة الرسالة:</label>
                            <div className="bg-darkBg/90 border border-darkBorder rounded-xl p-3 text-xs text-gray-300 whitespace-pre-line font-sans max-h-48 overflow-y-auto leading-relaxed border-r-2 border-r-emerald-500">
                                {preview}
                            </div>
                        </div>

                        {/* Buttons */}
                        <div className="flex items-center justify-between pt-2 gap-2">
                            <button
                                onClick={copyToClipboard}
                                className="px-3.5 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold transition flex items-center gap-1.5">
                                <i className="fa-solid fa-copy"></i>
                                <span>نسخ النص</span>
                            </button>

                            <button
                                onClick={() => onSend(customNote, includeRib)}
                                className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black transition flex items-center gap-2 shadow-lg shadow-emerald-950">
                                <i className="fa-brands fa-whatsapp text-sm"></i>
                                <span>إرسال عبر واتساب الآن</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        /* -------------------------------------------------------------
           RECEIPT MODAL COMPONENT (Official printable ticket slip)
           ------------------------------------------------------------- */
        function ReceiptModal({ device, settings, onClose }) {
            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white text-gray-900 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative my-auto">
                        <div className="no-print flex items-center justify-between border-b pb-3">
                            <span className="text-xs font-bold text-gray-500">معاينة وصل استلام الجهاز</span>
                            <div className="flex items-center gap-2">
                                <button onClick={handlePrint} className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold flex items-center gap-1.5">
                                    <i className="fa-solid fa-print"></i>
                                    <span>طباعة الوصل</span>
                                </button>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-900 p-1">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        {/* Printable Ticket */}
                        <div className="p-2 space-y-4 text-right" dir="rtl">
                            {/* Workshop Header */}
                            <div className="text-center border-b pb-3 space-y-1">
                                <h2 className="text-xl font-black text-gray-900">{settings.workshopName}</h2>
                                <p className="text-xs text-gray-600">{settings.address}</p>
                                <p className="text-xs text-gray-600 font-mono">الهاتف: {settings.phone}</p>
                                <div className="mt-2 inline-block px-3 py-1 bg-gray-100 rounded-full font-mono font-black text-sm">
                                    تذكرة رقم: #{device.id}
                                </div>
                            </div>

                            {/* Details */}
                            <div className="space-y-2 text-xs">
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">الزبون:</span>
                                    <span className="font-bold">{device.customerName}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">الهاتف:</span>
                                    <span className="font-mono">{device.phone}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">نوع الجهاز:</span>
                                    <span className="font-bold">{device.deviceModel}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">العطل المصرح به:</span>
                                    <span className="font-medium text-gray-800">{device.issue}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">رمز القفل:</span>
                                    <span className="font-mono font-bold">{device.passcode}</span>
                                </div>
                                <div className="flex justify-between border-b pb-1">
                                    <span className="text-gray-500">تاريخ الاستلام:</span>
                                    <span className="font-mono">{new Date(device.createdAt).toLocaleDateString('ar-MA')}</span>
                                </div>
                            </div>

                            {/* Financial */}
                            <div className="bg-gray-50 p-3 rounded-xl border flex justify-between items-center">
                                <span className="font-bold text-xs text-gray-700">المبلغ المتفق عليه للإصلاح:</span>
                                <span className="text-base font-black text-emerald-700 font-mono">
                                    {device.repairCost} {settings.currency}
                                </span>
                            </div>

                            {/* Bank RIB on receipt if available */}
                            {settings.rib && (
                                <div className="p-2 rounded bg-gray-50 border text-[10px] space-y-0.5">
                                    <span className="font-bold text-gray-700 block">للدفع عبر التحويل البنكي (RIB):</span>
                                    <span className="font-mono text-gray-900 block font-bold">{settings.rib}</span>
                                </div>
                            )}

                            {/* Terms */}
                            <div className="text-[9px] text-gray-500 space-y-1 pt-1 border-t">
                                <p>• يرجى الإدلاء بهذا الوصل عند استلام الجهاز.</p>
                                <p>• الورشة غير مسؤولة عن الأجهزة التي تتجاوز مدة بقائها 30 يوماً بعد الإشعار بالجاهزية.</p>
                                <p>• ضمان الإصلاح يشمل العطل المحدد فقط لمدة شهر من تاريخ التسليم.</p>
                            </div>

                            <div className="pt-3 text-center text-xs font-bold text-gray-800">
                                شكراً لثقتكم بنا!
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
